<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     LES CINQ ETATS DU PAIEMENT.
     Ce ne sont pas cinq etats d'egale nature : c'est UN moment d'attente
     et QUATRE issues. « sans reponse » n'est pas un cinquieme etat du
     paiement — c'est l'attente qui rend la main. Ce qui change entre
     « on verifie » et « sans reponse », ce n'est pas le paiement, c'est
     nous.
     Sur trois de ces ecrans le mot fait tout le travail : la couleur est
     sur un filet, jamais sur le sens.
     ------------------------------------------------------------------ */
  var T = {
    fr: {
      saut: 'Aller au contenu',
      phase: 'Version d\'essai. Des fonctions sont incomplètes ou indisponibles.',
      fCode: 'Six signes, lettres et chiffres — par exemple ABC123.',
      h1: 'Paiement',
      lCode: 'Ton code de commande',
      politique: 'Politique de confidentialité',
      cDit: 'Recevoir ta facture par courriel à ',
      cEnvoyer: 'Envoyer à cette adresse',
      cFait: 'C’est noté. Ta facture part à cette adresse dès qu’elle est prête.',
      etats: {
        attente: {
          titre: 'On vérifie ton paiement',
          dit: 'Reste sur cette page, ça prend moins d’une minute. Ton code est déjà enregistré : tu le retrouveras même si tu fermes cet onglet.',
          action: null, second: null, jauge: true, code: true
        },
        payee: {
          titre: 'Paiement reçu',
          dit: 'Ta commande est réglée. Tu peux emporter ta facture.',
          action: 'Recevoir ma facture', second: 'Retrouver ma commande',
          jauge: false, code: true
        },
        refusee: {
          titre: 'Le paiement n’a pas abouti',
          dit: '<strong>Aucun montant n’a été prélevé.</strong> Tu peux réessayer, ou régler au comptoir.',
          action: 'Réessayer le paiement', second: 'Retrouver ma commande',
          jauge: false, code: true
        },
        'sans-reponse': {
          titre: 'Pas encore de réponse',
          dit: 'Nous n’avons pas encore de réponse de ton opérateur. Cela peut prendre quelques minutes de plus.',
          avert: 'Ne paie pas une seconde fois. Si le montant est parti, il sera constaté et ta commande sera réglée. Garde ton code.',
          action: 'Vérifier à nouveau', second: 'Retrouver ma commande',
          jauge: false, code: true
        },
        'sans-reponse-long': {
          titre: 'Toujours pas de réponse',
          dit: 'Nous continuons de vérifier de notre côté. Tu n’as rien d’autre à faire ici : garde ton code, il retrouve ta commande à tout moment.',
          avert: 'Ne paie pas une seconde fois. Si le montant est parti, il sera constaté et ta commande sera réglée. Garde ton code.',
          action: 'Retrouver ma commande', second: null,
          jauge: false, code: true
        },
        regularisation: {
          titre: 'Ton paiement est bien arrivé',
          dit: 'Il reste une vérification de notre côté avant de valider ta commande. Nous revenons vers toi — garde ton code.',
          action: 'Retrouver ma commande', second: null,
          jauge: false, code: true
        }
      }
    },
    en: {
      saut: 'Skip to content',
      phase: 'Trial version. Some features are incomplete.',
      fCode: 'Six characters, letters and numbers. For example ABC123.',
      h1: 'Payment',
      lCode: 'Your order code',
      politique: 'Privacy policy',
      cDit: 'Email your invoice to ',
      cEnvoyer: 'Send it to this address',
      cFait: 'Done. We will email your invoice as soon as it is ready.',
      etats: {
        attente: {
          titre: 'Checking your payment',
          dit: 'This takes less than a minute. Your code is saved, so you will not lose it if you close this tab.',
          action: null, second: null, jauge: true, code: true
        },
        payee: {
          titre: 'Payment received',
          dit: 'Your order is paid. Your invoice is ready.',
          action: 'Get my invoice', second: 'Find my order',
          jauge: false, code: true
        },
        refusee: {
          titre: 'The payment did not go through',
          dit: '<strong>You have not been charged.</strong> Try again, or pay at the counter.',
          action: 'Try again', second: 'Find my order',
          jauge: false, code: true
        },
        'sans-reponse': {
          titre: 'No answer yet',
          dit: 'Your payment provider has not answered yet. This can take a few more minutes.',
          avert: 'Do not pay a second time. If the amount has left your account, it will be recorded and your order paid. Keep your code.',
          action: 'Check again', second: 'Find my order',
          jauge: false, code: true
        },
        'sans-reponse-long': {
          titre: 'Still no answer',
          dit: 'We are still checking. There is nothing more to do on this screen. Keep your code: it will find your order at any time.',
          avert: 'Do not pay a second time. If the amount has left your account, it will be recorded and your order paid. Keep your code.',
          action: 'Find my order', second: null,
          jauge: false, code: true
        },
        regularisation: {
          titre: 'Your payment has arrived',
          dit: 'One check remains before your order is confirmed. We will contact you. Keep your code.',
          action: 'Find my order', second: null,
          jauge: false, code: true
        }
      }
    }
  };

  /* Les libelles qui NOMMENT la vente changent avec le parcours : qui a
     reserve un espace ne « retrouve » pas une commande, et sa reservation
     n'est pas une commande reglee. Seul ce qui differe est double ; le reste
     du texte est commun. Le parcours se lit sur la remise, jamais deduit. */
  var SELON = {
    fr: {
      commande: {
        lCode: 'Ton code de commande',
        regle: 'Ta commande est réglée. Tu peux emporter ta facture.',
        retrouver: 'Retrouver ma commande',
        avert: 'Ne paie pas une seconde fois. Si le montant est parti, il sera constaté et ta commande sera réglée. Garde ton code.',
        enCours: 'Il reste une vérification de notre côté avant de valider ta commande. Nous revenons vers toi — garde ton code.'
      },
      reservation: {
        lCode: 'Ton code de réservation',
        regle: 'Ta réservation est réglée. Tu peux emporter ta facture.',
        retrouver: 'Retrouver ma réservation',
        avert: 'Ne paie pas une seconde fois. Si le montant est parti, il sera constaté et ta réservation sera réglée. Garde ton code.',
        enCours: 'Il reste une vérification de notre côté avant de valider ta réservation. Nous revenons vers toi — garde ton code.'
      }
    },
    en: {
      commande: {
        lCode: 'Your order code',
        regle: 'Your order is paid. Your invoice is ready.',
        retrouver: 'Find my order',
        avert: 'Do not pay a second time. If the amount has left your account, it will be recorded and your order paid. Keep your code.',
        enCours: 'One check remains before your order is confirmed. We will contact you. Keep your code.'
      },
      reservation: {
        lCode: 'Your booking code',
        regle: 'Your booking is paid. Your invoice is ready.',
        retrouver: 'Find my booking',
        avert: 'Do not pay a second time. If the amount has left your account, it will be recorded and your booking paid. Keep your code.',
        enCours: 'One check remains before your booking is confirmed. We will contact you. Keep your code.'
      }
    }
  };

  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }
  var $ = function (id) { return document.getElementById(id); };

  /* Deux parcours arrivent ici, et ils ne se retrouvent pas de la meme facon.
     Une COMMANDE se retrouve par le jeton garde dans ce navigateur. Une
     RESERVATION se retrouve par son code et son numero, remis par l'ecran
     d'encaissement. Dans les deux cas la verite se lit sur le serveur : le
     retour du widget ne vaut rien. */
  var remise = null;
  try {
    var brutRemise = sessionStorage.getItem('roots_remise_paiement');
    if (brutRemise) remise = JSON.parse(brutRemise);
  } catch (e) { remise = null; }

  var vente = null, lireEtat = null, parcours = 'commande';

  if (remise && remise.code && remise.tel &&
      String(remise.type || '').indexOf('reservation') === 0) {
    vente = { code: remise.code };
    parcours = 'reservation';
    lireEtat = (remise.type === 'reservation_logement')
      ? function () { return Roots.db.consulterReservationLogement(remise.code, remise.tel); }
      : function () { return Roots.db.consulterReservationEspace(remise.code, remise.tel); };
  } else if (remise && remise.code && remise.tel && remise.type === 'commande') {
    /* Commande reglee depuis un appareil qui ne detient pas son jeton : la
       remise porte alors le code et le numero, et la lecture passe par la porte
       qui les prend. Elle rend `statut_paiement`, ce que l'attente lit. */
    vente = { code: remise.code };
    lireEtat = function () { return Roots.db.consulterCommandeParCode(remise.code, remise.tel); };
  } else {
    var cmd = Roots.db.derniereCommande();
    if (cmd) {
      vente = cmd;
      lireEtat = function () { return Roots.db.consulterCommande(cmd.id, cmd.jeton); };
    }
  }

  var etatCourant = 'attente';

  function montrer(cle) {
    etatCourant = cle;
    var e = t().etats[cle];
    var p = $('panneau');
    p.setAttribute('data-issue', cle);
    $('titre').textContent = e.titre;
    $('dit').innerHTML = e.dit;
    $('jauge').classList.toggle('cache', !e.jauge);
    $('avert').classList.toggle('cache', !e.avert);
    if (e.avert) $('avert').textContent = e.avert;
    $('blocCode').classList.toggle('cache', !e.code || !vente);
    if (vente) $('code').textContent = vente.code || '------';
    $('action').classList.toggle('cache', !e.action);
    if (e.action) $('action').textContent = e.action;
    $('second').classList.toggle('cache', !e.second);
    if (e.second) $('second').textContent = e.second;
    nommerLaVente(cle);
    if (cle === 'payee') proposerCanal(); else cacherCanal();
  }

  function nommerLaVente(cle) {
    var mots = (SELON[langue] || SELON.fr)[parcours];
    var etiq = document.querySelector('#blocCode .etiquette');
    if (etiq) etiq.textContent = mots.lCode;
    if (cle === 'payee') $('dit').textContent = mots.regle;
    if (cle === 'sans-reponse' || cle === 'sans-reponse-long') $('avert').textContent = mots.avert;
    if (cle === 'regularisation' || cle === 'sans-reponse-long') {
      if (cle === 'regularisation') $('dit').textContent = mots.enCours;
      $('action').textContent = mots.retrouver;
    } else if (!$('second').classList.contains('cache')) {
      $('second').textContent = mots.retrouver;
    }
  }

  /* ------------------------------------------------------------------
     LE CANAL DE REMISE — l'envoi de la piece par courriel.

     DEUX CONDITIONS, et l'absence d'une seule retire l'offre : le prestataire
     doit avoir transmis une adresse, et la notice du canal doit exister en
     base, servie et versionnee.

     DEUX FACONS DE NOMMER LA VENTE, et l'ecran prend celle dont il dispose. Le
     CODE et le NUMERO valent pour qui arrive d'un autre appareil. Le JETON de
     commande vaut pour le navigateur qui l'a passee — une commande servie a
     table n'a pas de numero, et le couple n'y existera jamais. Les deux portes
     de lecture rendent la meme forme masquee.

     L'ADRESSE NE SE SAISIT PAS ET NE SE TRANSMET PAS. Ce que cet ecran connait
     est un MASQUE — de quoi reconnaitre une adresse, jamais de quoi en ecrire
     une. L'adresse reelle ne quitte pas le serveur, et la passerelle refuse un
     masque avant l'appel.

     LE GESTE VAUT CONSENTEMENT. La notice se lit au-dessus du bouton, dans sa
     langue, et c'est l'appui qui consent — sur la version affichee, jamais sur
     une chaine choisie ici. Aucune case n'est prete a l'avance : une case
     pre-cochee tiendrait pour accord ce que personne n'a donne.

     LE MOMENT COMPTE. Le canal se pose apres le paiement et avant que la piece
     ne soit scellee : c'est le seul ordre qui fait partir la piece au premier
     tour d'envoi. Pose plus tard, l'envoi est rattrape, jamais immediat.
     ------------------------------------------------------------------ */
  var noticeCanal = null;
  var canalDemande = false;
  var canalPose = false;
  var canalMessage = null;

  /* Le couple prime sur le jeton : il vaut pour les trois parcours, la ou le
     jeton ne nomme qu'une commande. */
  function identite() {
    if (remise && remise.code && remise.tel) {
      return { par: 'code', code: remise.code, tel: remise.tel };
    }
    if (parcours === 'commande' && vente && vente.id && vente.jeton) {
      return { par: 'jeton', id: vente.id, jeton: vente.jeton };
    }
    return null;
  }

  function cacherCanal() {
    $('blocCanal').classList.add('cache');
  }

  function dessinerCanal() {
    $('canalDit').textContent = t().cDit;
    $('canalNotice').textContent = Roots.db.texteNotice(noticeCanal, langue);
    $('btnCourriel').textContent = t().cEnvoyer;
    $('btnCourriel').classList.toggle('cache', canalPose);
    $('canalNotice').classList.toggle('cache', canalPose);
    $('canalIssue').classList.toggle('cache', !canalMessage && !canalPose);
    $('canalIssue').textContent = canalPose ? t().cFait : (canalMessage || '');
  }

  /* Une lecture qui echoue — couple qui ne concorde pas, reseau — ne dit rien :
     l'offre disparait et le telechargement reste. Un client qui vient de payer
     n'a pas a lire l'echec d'une lecture qu'il n'a pas demandee. */
  function proposerCanal() {
    var i = identite();
    if (!i || canalDemande) { if (noticeCanal) dessinerCanal(); return; }
    canalDemande = true;
    Promise.all([
      (i.par === 'code')
        ? Roots.db.contactDuPayeurDeLaVente(i.code, i.tel)
        : Roots.db.contactDuPayeurDeLaCommande(i.id, i.jeton),
      Roots.db.notice('remise_courriel')
    ]).then(function (r) {
      var contact = r[0], texte = r[1];
      if (!contact || contact.resultat !== 'trouve' || !contact.courriel_masque) return;
      if (!texte || !texte.version) return;
      noticeCanal = texte;
      $('adresseMasquee').textContent = contact.courriel_masque;
      dessinerCanal();
      if (etatCourant === 'payee') $('blocCanal').classList.remove('cache');
    }, function () { return null; });
  }

  /* AUCUNE ADRESSE N'EST TRANSMISE. La porte va chercher elle-meme celle
     qu'elle detient, comme la porte de paiement va chercher le montant : ce que
     l'ecran envoie est le canal et la version de la notice lue, rien d'autre. */
  function poserCanal() {
    var i = identite();
    if (!noticeCanal || !i || canalPose) return Promise.resolve();
    canalMessage = null;
    $('btnCourriel').disabled = true;
    var appel;
    if (parcours === 'reservation') {
      appel = Roots.db.choisirRemiseReservation({
        type: remise.type === 'reservation_logement' ? 'logement' : 'espace',
        code: i.code, tel: i.tel, canal: 'courriel',
        consentement: noticeCanal.version });
    } else if (i.par === 'code') {
      appel = Roots.db.choisirRemiseCommandeParCode({
        code: i.code, tel: i.tel, canal: 'courriel',
        consentement: noticeCanal.version });
    } else {
      appel = Roots.db.choisirRemiseCommande({
        id: i.id, jeton: i.jeton, canal: 'courriel',
        consentement: noticeCanal.version });
    }
    return Promise.resolve(appel).then(function () {
      canalPose = true;
      /* L'ecran de la piece pose lui aussi un canal pour obtenir son jeton :
         sans cette note, il ecraserait celui-ci par un telechargement. */
      Roots.db.noterCanalRemis('courriel', noticeCanal.version);
      dessinerCanal();
    }, function (e) {
      $('btnCourriel').disabled = false;
      canalMessage = (e && e.message) || '';
      dessinerCanal();
    });
  }

  $('btnCourriel').addEventListener('click', function () {
    if ($('btnCourriel').disabled) return;
    poserCanal();
  });

  /* Le verrou se ferme au premier appui et ne se rouvre qu'a la reponse : il
     couvre le double appui sur reseau lent. Un rechargement suivi d'un clic est
     un geste voulu, et il passe. */
  var verrou = false;
  $('action').addEventListener('click', function () {
    if (verrou) return;
    verrou = true;
    $('action').disabled = true;
    Promise.resolve()
      .then(function () { return agir(etatCourant); })
      .then(function () { verrou = false; $('action').disabled = false; });
  });

  function agir(cle) {
    if (cle === 'sans-reponse') return sonder();
    if (cle === 'refusee') return reessayer();
    if (cle === 'payee') { location.href = 'facture.html'; return; }
    location.href = 'retrouver.html';
  }

  /* REESSAYER, au sens ou le bouton le dit. Un echec n'est pas terminal : le
     serveur ouvre une intention NEUVE, au montant du jour, et n'a rien a
     defaire — un paiement refuse n'ecrit aucune ligne financiere et ne produit
     aucune piece. Le montant vient de la porte, jamais de l'ecran.
     Si la porte refuse — vente deja reglee, montant nul, retenue expiree — on
     relit l'etat plutot que d'affirmer : la raison du refus se lit la, pas
     ici. */
  function reessayer() {
    if (!vente) { location.href = 'index.html'; return Promise.resolve(); }
    var ouvrir;
    if (parcours === 'reservation') {
      ouvrir = Roots.db.initierPaiementReservation(
        remise.type === 'reservation_logement' ? 'logement' : 'espace',
        remise.code, remise.tel);
    } else if (remise && remise.code && remise.tel) {
      ouvrir = Roots.db.initierPaiementCommandeParCode(remise.code, remise.tel);
    } else {
      ouvrir = Roots.db.initierPaiementCommande(vente.id, vente.jeton);
    }

    return Promise.resolve(ouvrir).then(function (r) {
      var neuve = { paiement: r.paiement, montant: r.montant, type: remise ? remise.type : 'commande' };
      if (remise && remise.code && remise.tel) { neuve.code = remise.code; neuve.tel = remise.tel; }
      if (!Roots.db.remisePaiement(neuve)) { location.href = 'index.html'; return; }
      location.assign('payer.html');
    }, function () { return sonder(); });
  }

  /* La verite se lit sur le serveur, jamais sur le retour du widget.
     suivrePaiement rend « indetermine » passe le delai, jamais « paye ». */
  /* LE PLAFOND. « Verifier a nouveau » rappelle la meme lecture : sans butee,
     l'ecran tourne sur lui-meme aussi longtemps que le visiteur appuie, en
     promettant a chaque tour une reponse qu'il n'a pas. Au 3e passage sans
     reponse il cesse de promettre — SANS NOMMER DE CAUSE, qu'il ignore — et
     rend la main a l'ecran qui, lui, retrouve la vente. Le compteur ne compte
     que les tours restes sans reponse : une reponse quelconque le remet a zero,
     parce qu'elle prouve que la lecture aboutit.
     LE SEUIL EST GENEREUX A DESSEIN. Il borne l'attente, il ne borne pas le
     paiement : le geste « reessayer », lui, ouvre une intention neuve a chaque
     appui et ne se plafonne nulle part. */
  var SEUIL_ATTENTE = 5;
  var sansReponse = 0;

  function attente() {
    sansReponse += 1;
    return sansReponse >= SEUIL_ATTENTE ? 'sans-reponse-long' : 'sans-reponse';
  }

  function sonder() {
    if (!vente || !lireEtat) { montrer(attente()); return Promise.resolve(); }
    montrer('attente');
    return Roots.db.suivrePaiement(lireEtat).then(function (r) {
      var carte = {
        verifie: 'payee', paye: 'payee',
        refuse: 'refusee', echoue: 'refusee',
        a_regulariser: 'regularisation',
        indetermine: 'sans-reponse'
      };
      var cle = carte[r.statut];
      if (!cle || cle === 'sans-reponse') { montrer(attente()); return; }
      sansReponse = 0;
      montrer(cle);
    }, function () { montrer(attente()); });
  }

  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    montrer(etatCourant);
  }

  var chrome = Roots.initChrome({ toastId: 'toast', getLangue: function () { return langue; }, getSections: Roots.nav,
    radio: true,
    onLangue: function () { basculerLangue(); }
  });
  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    Roots.retenirLangue(langue);
    appliquerLangue();
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
  }

  /* Revue : ?etat=payee|refusee|sans-reponse|regularisation|attente
     Sans parametre, l'ecran sonde reellement le serveur. */
  var demande = new URLSearchParams(location.search).get('etat');
  if (demande && !vente) vente = { code: 'ABC123' };
  appliquerLangue();
  if (demande && t().etats[demande]) montrer(demande);
  else sonder();
})();
</script>
</body>
