<script>
(function () {
  'use strict';

  /* Une adresse partagee par le systeme se garde sur l'appareil avant
     tout renvoi, puis se consomme a la premiere ouverture en session :
     le geste de capture survit a la couverture. */
  (function () {
    var q = new URLSearchParams(location.search);
    var p = { titre: q.get('titre') || '', texte: q.get('texte') || '', adresse: q.get('adresse') || '' };
    if (p.titre || p.texte || p.adresse) {
      try { localStorage.setItem('roots.partage.attente', JSON.stringify(p)); } catch (e) {}
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
    }
  })();

  /* L'ecran exige une session : sans elle, la couverture est la porte. */
  if (!window.Roots || !Roots.db || !Roots.db.estConnecte()) {
    location.replace('onboard.html');
    return;
  }
  window.addEventListener('roots:session', function (e) {
    if (!e.detail.connecte) location.replace('onboard.html');
  });

  /* Deux vues sur la meme base locale : le fil, chronologique, ou l'on
     ecrit ; le mur, filtrable, ou l'on range — l'epingle et le retrait
     n'existent que la. Les notes ne quittent jamais l'appareil ; seule la
     ligne promue part, par la porte du service. */
  var LIMITE_ENGAGEMENT = 120;
  var NOTES = [];
  var filtre = 'tout';
  var quete = '';

  var T = {
    fr: {
      saut: 'Aller au contenu',
      fEpingle: 'Épinglées',
      fListe: 'Listes',
      fBreve: 'Pense-bêtes',
      fEcrit: 'Écrits',
      videMur: 'Rien pour l’instant. Écris-toi — une idée, une liste.',
      versSavoir: 'Un lien se range dans ton Savoir, un peu plus bas.',
      labNote: 'Écris-toi',
      phNote: 'Écris-toi.',
      vers: '→ Ma Semaine',
      posee: 'Dans ta semaine',
      epingler: 'Épingler',
      desepingler: 'Épinglée',
      retirer: 'Retirer',
      retirerSur: 'Retirer ?',
      garder: 'Garder',
      retiree: 'Note retirée',
      annuler: 'Annuler',
      labChercher: 'Chercher dans mes notes',
      phChercher: 'Chercher…',
      videQuete: 'Rien ne répond à cette recherche.',
      notesMuettes: 'Les notes n’ont pas répondu.',
      aujourdhui: 'Aujourd’hui',
      hier: 'Hier',
      coche: function (n, f) { return f + ' / ' + n + ' coché'; },
      piedPolitique: 'Politique de confidentialité',
      toastNu: 'Le mode NU (communauté) arrive bientôt.'
    },
    en: {
      saut: 'Skip to content',
      fEpingle: 'Pinned',
      fListe: 'Lists',
      fBreve: 'Quick notes',
      fEcrit: 'Writings',
      videMur: 'Nothing yet. Write to yourself — an idea, a list.',
      versSavoir: 'Links live in your Knowledge bank, just below.',
      labNote: 'Write to yourself',
      phNote: 'Write to yourself.',
      vers: '→ My week',
      posee: 'In your week',
      epingler: 'Pin',
      desepingler: 'Pinned',
      retirer: 'Remove',
      retirerSur: 'Remove?',
      garder: 'Keep',
      retiree: 'Note removed',
      annuler: 'Undo',
      labChercher: 'Search your notes',
      phChercher: 'Search…',
      videQuete: 'Nothing matches this search.',
      notesMuettes: 'The notes didn’t answer.',
      aujourdhui: 'Today',
      hier: 'Yesterday',
      coche: function (n, f) { return f + ' / ' + n + ' checked'; },
      piedPolitique: 'Privacy policy',
      toastNu: 'NU, the community side of Roots, is coming soon.'
    }
  };

  function $(id) { return document.getElementById(id); }
  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }

  function coche() {
    return $('tplCoche').content.firstElementChild.cloneNode(true);
  }

  function jourDe(ts) {
    var d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  function nomDuJour(ts) {
    var un = 24 * 60 * 60 * 1000;
    var ecart = jourDe(Date.now()) - jourDe(ts);
    if (ecart === 0) return t().aujourdhui;
    if (ecart === un) return t().hier;
    return new Date(ts).toLocaleDateString(langue === 'fr' ? 'fr-FR' : 'en-GB',
      { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function heure(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function texteDe(note) {
    var s = note.type === 'lien' ? note.url
      : (note.texte || (note.items && note.items[0] ? note.items[0].t : ''));
    return s.length > LIMITE_ENGAGEMENT ? s.slice(0, LIMITE_ENGAGEMENT - 1) + '…' : s;
  }

  function corpsDe(note) {
    var z = document.createDocumentFragment();
    if (note.type === 'lien') {
      var a = document.createElement('a');
      a.className = 'note-lien';
      a.href = note.url;
      a.target = '_blank';
      a.rel = 'noopener';
      var ou = '';
      try { ou = new URL(note.url).hostname; } catch (e) { ou = note.url; }
      var pic = document.createElement('span');
      pic.className = 'note-lien-pic';
      pic.textContent = '↗';
      var mots = document.createElement('span');
      var quoi = document.createElement('span');
      quoi.className = 'note-lien-quoi';
      quoi.textContent = ou;
      var brut = document.createElement('span');
      brut.className = 'note-lien-ou';
      brut.textContent = note.url;
      mots.appendChild(quoi);
      mots.appendChild(document.createElement('br'));
      mots.appendChild(brut);
      a.appendChild(pic);
      a.appendChild(mots);
      z.appendChild(a);
      return z;
    }
    if (note.texte) {
      var p = document.createElement('p');
      p.appendChild(avecMarques(note.texte));
      if (note.type === 'liste') p.className = 'note-titre';
      z.appendChild(p);
    }
    if (note.type === 'liste') {
      var ul = document.createElement('div');
      ul.className = 'coches';
      /* Une ligne cochee descend au bas de la liste et la decocher la fait
         remonter ; l'indice porte est celui de la donnee, pas de l'ecran. */
      var rangees = note.items.map(function (item, i) { return { item: item, i: i }; });
      rangees.sort(function (a, b) { return (a.item.fait ? 1 : 0) - (b.item.fait ? 1 : 0); });
      rangees.forEach(function (r) {
        var item = r.item, i = r.i;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'note-item' + (item.fait ? ' fait' : '');
        b.dataset.id = note.id;
        b.dataset.indice = String(i);
        b.setAttribute('aria-pressed', item.fait ? 'true' : 'false');
        var c = document.createElement('span');
        c.className = 'note-case';
        c.appendChild(coche());
        var m = document.createElement('span');
        m.appendChild(avecMarques(item.t));
        b.appendChild(c);
        b.appendChild(m);
        ul.appendChild(b);
      });
      z.appendChild(ul);
    }
    return z;
  }

  /* Le mot cherche s'eclaire dans la note rendue. La coincidence se prend sans
     casse ; un ecart d'accent laisse la note visible sans l'eclairer. */
  function avecMarques(texte) {
    var z = document.createDocumentFragment();
    if (!quete) { z.appendChild(document.createTextNode(texte)); return z; }
    var bas = String(texte).toLowerCase(), i = 0, j;
    while ((j = bas.indexOf(quete, i)) !== -1) {
      if (j > i) z.appendChild(document.createTextNode(texte.slice(i, j)));
      var m = document.createElement('mark');
      m.className = 'trouve';
      m.textContent = texte.slice(j, j + quete.length);
      z.appendChild(m);
      i = j + quete.length;
    }
    z.appendChild(document.createTextNode(texte.slice(i)));
    return z;
  }

  function rangDe(note, gestion) {
    var rang = document.createElement('div');
    rang.className = 'note-rang';
    var q = document.createElement('span');
    q.className = 'note-quand';
    q.textContent = gestion ? nomDuJour(note.cree) + ', ' + heure(note.cree) : heure(note.cree);
    rang.appendChild(q);
    if (note.promue) {
      var pos = document.createElement('span');
      pos.className = 'note-posee';
      pos.textContent = t().posee;
      rang.appendChild(pos);
    } else {
      var v = document.createElement('button');
      v.type = 'button';
      v.className = 'bouton-vers';
      v.dataset.geste = 'vers';
      v.dataset.id = note.id;
      v.textContent = t().vers;
      rang.appendChild(v);
    }
    return rang;
  }

  /* Les deux pastilles tiennent la ligne du titre, a droite — la grammaire du
     hall, ou le nom est a gauche et le geste a droite. Le texte partage leur
     premiere ligne et reprend toute la largeur ensuite. */
  function gestesDe(note) {
    var z = document.createElement('div');
    z.className = 'note-gestes';
    var ep = document.createElement('button');
    ep.type = 'button';
    ep.className = 'geste-note';
    ep.dataset.geste = 'epingler';
    ep.dataset.id = note.id;
    ep.setAttribute('aria-pressed', note.epingle ? 'true' : 'false');
    ep.setAttribute('aria-label', note.epingle ? t().desepingler : t().epingler);
    ep.appendChild($('tplPin').content.firstElementChild.cloneNode(true));
    z.appendChild(ep);
    var re = document.createElement('button');
    re.type = 'button';
    re.className = 'geste-note';
    re.dataset.geste = 'retirer';
    re.dataset.id = note.id;
    re.setAttribute('aria-label', t().retirer);
    re.appendChild($('tplCroix').content.firstElementChild.cloneNode(true));
    z.appendChild(re);
    return z;
  }

  function carte(note, gestion) {
    var a = document.createElement('article');
    a.id = 'n-' + note.id;
    a.className = 'note-carte' + (note.epingle && gestion ? ' tenue' : '');
    if (gestion) a.appendChild(gestesDe(note));
    a.appendChild(corpsDe(note));
    a.appendChild(rangDe(note, gestion));
    return a;
  }

  /* Le fil se lit comme on l'ecrit : les jours en descendant, le plus
     recent au bas, pres de la saisie. */
  /* Le mot cherche se compare a tout ce qui se lit dans la note : son texte,
     ses items, son adresse. Sans accent ni casse — on cherche ce qu'on a en
     tete, pas ce qu'on a tape. */
  function aplati(v) {
    return String(v || '').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function contient(note, mot) {
    if (!mot) return true;
    var tout = [note.texte || '', note.url || ''];
    (note.items || []).forEach(function (i) { tout.push(i.t); });
    return aplati(tout.join(' ')).indexOf(mot) !== -1;
  }
  /* Un lien n'est pas une note : il se range au Savoir, et c'est la qu'il se
     retrouve. Le pense-bete est la note qui se lit d'un coup d'oeil — deux
     lignes de donnees au plus, quatre-vingt-dix signes ; l'ecrit est le reste. */
  function estBreve(note) {
    return note.type === 'texte' &&
      (note.texte.match(/\n/g) || []).length <= 1 &&
      note.texte.length <= 90;
  }
  function garde(note) {
    if (note.type === 'lien') return false;
    if (!contient(note, quete)) return false;
    if (filtre === 'epingle') return note.epingle;
    if (filtre === 'liste') return note.type === 'liste';
    if (filtre === 'breve') return estBreve(note);
    if (filtre === 'ecrit') return note.type === 'texte' && !estBreve(note);
    return true;
  }

  /* Le mur range : les epinglees d'abord, puis du plus recent au plus
     ancien, sous le filtre choisi. */
  function dessinerMur() {
    var z = $('murNotes');
    z.textContent = '';
    var liste = NOTES.filter(garde).sort(function (a, b) {
      return (b.epingle - a.epingle) || (b.cree - a.cree);
    });
    var v = $('videMur');
    v.hidden = liste.length > 0;
    v.textContent = quete ? t().videQuete : t().videMur;
    liste.forEach(function (n) { z.appendChild(carte(n, true)); });
  }

  /* Le retrait s'applique tout de suite et se repare a la place meme de la
     note, le temps d'un delai. Une note reposee garde son identifiant et sa
     date : c'est la meme, pas une copie. */
  var DELAI_RATTRAPAGE = 8000;
  function rattrapage(note) {
    var l = document.createElement('div');
    l.className = 'rattrapage';
    var d = document.createElement('span');
    d.textContent = t().retiree;
    var a = document.createElement('button');
    a.type = 'button';
    a.className = 'bouton-doux';
    a.textContent = t().annuler;
    a.addEventListener('click', function () {
      SpaceNotes.reposer(note).then(charger).then(dessiner,
        function () { chrome.toast(t().notesMuettes); });
    });
    l.appendChild(d);
    l.appendChild(a);
    setTimeout(function () { if (l.isConnected) l.remove(); }, DELAI_RATTRAPAGE);
    return l;
  }

  /* Toucher une note l'ouvre en ecriture LA OU ELLE EST : son corps devient le
     composeur, deja rempli. Fermer — par la pastille, l'entree au clavier ou un
     appui hors de la carte — garde ce qui a change ; la touche d'echappement
     abandonne. Un texte vide n'efface jamais la note : le retrait est un geste
     propre, il ne se produit pas par accident. */
  var enEdition = null;
  function texteBrut(note) {
    if (note.type === 'lien') return note.url;
    var lignes = [];
    if (note.texte) lignes.push(note.texte);
    (note.items || []).forEach(function (i) { lignes.push('- ' + i.t); });
    return lignes.join('\n');
  }
  function editerSurPlace(note, hote) {
    if (enEdition) fermerEdition(true);
    var avant = texteBrut(note);
    var z = document.createElement('div');
    z.className = 'ecrire ecrire-carte a-du-texte';
    var ta = document.createElement('textarea');
    ta.rows = 1;
    ta.maxLength = 4000;
    ta.value = avant;
    var env = document.createElement('button');
    env.type = 'button';
    env.className = 'envoi';
    env.setAttribute('aria-label', t().garder);
    env.appendChild($('btnPoser').firstElementChild.cloneNode(true));
    z.appendChild(ta);
    z.appendChild(env);
    hote.classList.add('en-edition');
    hote.textContent = '';
    hote.appendChild(z);
    enEdition = { id: note.id, avant: avant, hote: hote, champ: ta };
    function tailler() {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 144) + 'px';
    }
    tailler();
    ta.addEventListener('input', tailler);
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); fermerEdition(false); return; }
      if (continuerListe(e, ta)) { tailler(); return; }
      if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) {
        e.preventDefault();
        fermerEdition(true);
      }
    });
    env.addEventListener('click', function () { fermerEdition(true); });
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  function fermerEdition(garder) {
    if (!enEdition) return;
    var e = enEdition;
    enEdition = null;
    var brut = e.champ.value;
    if (garder && brut.trim() && brut !== e.avant) {
      SpaceNotes.modifier(e.id, brut)
        .then(charger).then(dessiner, function () { chrome.toast(t().notesMuettes); });
    } else {
      dessiner();
    }
  }
  document.addEventListener('pointerdown', function (e) {
    if (enEdition && !enEdition.hote.contains(e.target)) fermerEdition(true);
  });

  /* Une ligne ouverte par un tiret se poursuit d'elle-meme a l'entree ; une
     ligne restee vide referme la liste au meme geste. */
  function continuerListe(e, ta) {
    if (e.key !== 'Enter' || e.shiftKey) return false;
    var pos = ta.selectionStart;
    var debut = ta.value.lastIndexOf('\n', pos - 1) + 1;
    var ligne = ta.value.slice(debut, pos);
    if (/^\s*-\s+\S/.test(ligne)) {
      e.preventDefault();
      ta.setRangeText('\n- ', pos, ta.selectionEnd, 'end');
      return true;
    }
    if (/^\s*-\s*$/.test(ligne)) {
      e.preventDefault();
      ta.setRangeText('', debut, pos, 'end');
      return true;
    }
    return false;
  }

  function dessiner() { dessinerMur(); }

  function charger() {
    return SpaceNotes.toutes().then(function (liste) { NOTES = liste; });
  }


  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-p]').forEach(function (el) {
      var v = t()[el.getAttribute('data-p')];
      if (typeof v === 'string') el.placeholder = v;
    });
    dessiner();
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
  }

  var chrome = Roots.initChrome({
    toastId: 'toast',
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    radio: true,
    onLangue: function () { basculerLangue(); }
  });

  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    if (Roots.retenirLangue) Roots.retenirLangue(langue);
    appliquerLangue();
  }

  /* Le champ d'ecriture ne depend pas de la vue : on ecrit d'ou l'on est. */
  $('quoi').addEventListener('input', function () {
    quete = aplati(this.value.trim());
    dessinerMur();
  });

  /* On arrive parfois sur une note precise, depuis le hall. On ouvre alors le
     fil — c'est la que la note se lit dans son temps — et on la designe un
     instant. */
  function menerALaNote() {
    var m = /^#n-(.+)$/.exec(location.hash || '');
    if (!m) return false;
    var cible = $('n-' + m[1]);
    if (!cible) return false;
    cible.classList.add('designee');
    cible.scrollIntoView({ block: 'center' });
    setTimeout(function () { cible.classList.remove('designee'); }, 2400);
    return true;
  }

  /* Une pilule s'allume seule ; la re-toucher rend la vue entiere. */
  $('filtres').addEventListener('click', function (e) {
    var b = e.target.closest('.filtre');
    if (!b) return;
    filtre = (filtre === b.dataset.filtre) ? 'tout' : b.dataset.filtre;
    $('filtres').querySelectorAll('.filtre').forEach(function (f) {
      f.setAttribute('aria-pressed', f.dataset.filtre === filtre ? 'true' : 'false');
    });
    dessinerMur();
  });

  var champ = $('champNote');

  /* La hauteur suit le texte. Le contenant porte deux marques : le champ non
     vide, qui commande l'aplat de la pastille et annonce qu'il y a de quoi
     envoyer — les espaces seuls ne comptent pas, l'envoi les refuse ; et le
     passage de la premiere ligne, qui fait reculer la commande de son angle.
     La hauteur d'une ligne se mesure sur le champ vide au premier passage :
     elle depend de la fonte servie et ne s'ecrit pas. */
  var hauteurUneLigne = 0;
  function ajusterChamp() {
    champ.style.height = 'auto';
    if (!hauteurUneLigne) hauteurUneLigne = champ.scrollHeight;
    var pleine = champ.scrollHeight;
    champ.style.height = Math.min(pleine, 144) + 'px';
    var cadre = champ.closest('.ecrire');
    cadre.classList.toggle('a-du-texte', champ.value.trim() !== '');
    cadre.classList.toggle('est-longue', pleine > hauteurUneLigne);
  }
  /* Le meme brouillon vit dans le hall et ici : commencer d'un cote, finir de
     l'autre. L'envoi l'efface ; le stockage peut etre refuse, la saisie n'en
     depend pas. */
  var BROUILLON = 'roots.space.brouillon';
  function retenirBrouillon(v) {
    try { if (v) localStorage.setItem(BROUILLON, v); else localStorage.removeItem(BROUILLON); }
    catch (e) {}
  }
  champ.addEventListener('input', function () {
    ajusterChamp();
    retenirBrouillon(champ.value);
  });
  try {
    var repris = localStorage.getItem(BROUILLON);
    if (repris && !champ.value) champ.value = repris;
  } catch (e) {}
  ajusterChamp();

  function poser() {
    var brut = champ.value;
    if (!brut.trim()) { champ.focus(); return; }
    SpaceNotes.poser(brut).then(function (note) {
      champ.value = '';
      retenirBrouillon('');
      ajusterChamp();
      if (note.type === 'lien') chrome.toast(t().versSavoir);
      return charger();
    }).then(function () {
      dessiner();
      champ.focus();
    }, function () { chrome.toast(t().notesMuettes); });
  }
  $('btnPoser').addEventListener('click', poser);

  /* Sur clavier physique, l'entree envoie et la ligne se demande avec la
     majuscule ; sur l'ecran tactile, seule la commande envoie. */
  champ.addEventListener('keydown', function (e) {
    if (continuerListe(e, champ)) { ajusterChamp(); retenirBrouillon(champ.value); return; }
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) {
      e.preventDefault();
      poser();
    }
  });

  function trouver(id) {
    var note = null;
    NOTES.forEach(function (n) { if (n.id === id) note = n; });
    return note;
  }

  /* La promotion pose la ligne dans la semaine par la porte du service ;
     un refus rend le geste et le dit. Le retrait demande deux appuis : le
     premier arme, le second seul efface. */
  document.getElementById('contenu').addEventListener('click', function (e) {
    /* Toucher une note l'ouvre en ecriture sur place — partout sauf sur une
       commande ou un lien, qui gardent leur geste. Meme regle que les modules
       du hall. */
    if (!e.target.closest('button, a, textarea')) {
      var hote = e.target.closest('.note-carte');
      if (hote && hote.id.indexOf('n-') === 0 && !hote.classList.contains('en-edition')) {
        var vise = trouver(hote.id.slice(2));
        if (vise) { editerSurPlace(vise, hote); return; }
      }
    }
    var b = e.target.closest('[data-geste], .note-item');
    if (!b || b.disabled) return;

    if (b.classList.contains('note-item')) {
      var fait = b.getAttribute('aria-pressed') !== 'true';
      SpaceNotes.cocher(b.dataset.id, parseInt(b.dataset.indice, 10), fait)
        .then(charger).then(dessiner, function () { chrome.toast(t().notesMuettes); });
      return;
    }

    var note = trouver(b.dataset.id);
    if (!note) return;

    if (b.dataset.geste === 'vers') {
      b.disabled = true;
      Roots.db.appeler('plan_poser_tache', { p_engagement: texteDe(note), p_jour: null })
        .then(function () { return SpaceNotes.marquerPromue(note.id); })
        .then(charger)
        .then(dessiner, function (er) { b.disabled = false; chrome.toast(er.message); });
      return;
    }

    if (b.dataset.geste === 'epingler') {
      SpaceNotes.epingler(note.id, !note.epingle)
        .then(charger).then(dessiner, function () { chrome.toast(t().notesMuettes); });
      return;
    }

    if (b.dataset.geste === 'retirer') {
      var place = b.closest('.note-carte');
      SpaceNotes.retirer(note.id).then(function (gardee) {
        if (!gardee) return charger().then(dessiner);
        if (enEdition && enEdition.id === note.id) { enEdition = null; }
        if (place && place.isConnected) place.replaceWith(rattrapage(gardee));
        return charger();
      }, function () { chrome.toast(t().notesMuettes); });
    }
  });

  /* La capture en attente se pose par le mecanisme ordinaire ; le titre
     partage se garde a part, pour la salle de lecture. */
  function consommerPartage() {
    var p = null;
    try {
      p = JSON.parse(localStorage.getItem('roots.partage.attente') || 'null');
      localStorage.removeItem('roots.partage.attente');
    } catch (e) {}
    if (!p) return Promise.resolve();
    var url = p.adresse;
    if (!url) { var m = (p.texte || '').match(/https?:\/\/\S+/); if (m) url = m[0]; }
    var matiere = url || p.texte || p.titre;
    if (!matiere) return Promise.resolve();
    if (url && p.titre) {
      try {
        var t2 = JSON.parse(localStorage.getItem('roots.savoir.titres') || '{}');
        t2[url] = p.titre;
        localStorage.setItem('roots.savoir.titres', JSON.stringify(t2));
      } catch (e) {}
    }
    return SpaceNotes.poser(matiere).then(function () {}, function () {});
  }

  if (Roots.poserLibelles) Roots.poserLibelles();
  appliquerLangue();
  consommerPartage().then(charger).then(function () {
    dessinerMur();
    menerALaNote();
  }, function () { chrome.toast(t().notesMuettes); });
})();
</script>
</body>
</html>
