<!-- ══════════════ CHROME HAUT ══════════════ -->
<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil" data-al-chrome="accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU" data-al-chrome="mode"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="index.html">Roots</a>
    </div>
    <div class="chrome-droite">
      <button class="lang-btn" id="btnLangue" aria-label="Langue" data-al-chrome="langue">EN</button>
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-al-chrome="menu"><svg class="i"><use href="#i-menu"/></svg></button>

<div id="contenu" class="corps">
  <div id="badgeContexte"></div>
  <h1 data-t="titre">La carte</h1>
  <p class="sous-titre" id="sousTitre"></p>

  <div class="categories" id="categories"></div>
  <p class="erreur" id="erreurCarte" role="alert" aria-live="polite"></p>
  <div id="listeMenu"></div>
</div>

<button class="barre-panier cachee" id="barrePanier">
  <span><span class="badge" id="badgeQte">0</span><span data-t="voirCommande">Voir ma commande</span></span>
  <span id="barreTotal"></span>
</button>

<div class="voile" id="voile"></div>

<div class="panneau" id="panneau" role="dialog" aria-modal="true" aria-label="Ma commande" data-al-chrome="commande">
  <div class="poignee"></div>
  <div id="vueCommande">
    <div class="entete-panneau">
      <div><h2 data-t="maCommande">Ma commande</h2><p id="sousPanneau"></p></div>
      <button class="fermer" id="btnFermer" aria-label="Fermer" data-al-chrome="fermer"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div id="lignesPanier"></div>
    <div class="total-ligne"><span data-t="total">Total</span><span class="montant" id="panneauTotal"></span></div>

    <div id="champsEmporter">
      <div class="champ">
        <label for="nom" data-t="tonNom">Ton nom (pour t'appeler)</label>
        <input id="nom" autocomplete="given-name" data-p="pNom" placeholder="Ton prénom">
      </div>
      <div class="champ">
        <label for="telephone" data-t="tonTel">Ton numéro</label>
        <input type="tel" inputmode="tel" id="telephone" autocomplete="tel">
      </div>
    </div>

    <span class="etiquette-paiement" data-t="etPaiement">Paiement</span>
    <div class="paiements" id="paiements"></div>
    <button class="bouton-confirmer" id="btnCommander" disabled data-t="commander">Commander</button>
    <p class="erreur" id="erreurCmd" role="alert" aria-live="polite"></p>
    <p class="mention" data-t="mentionPaiement">Paiement sécurisé via KkiaPay.</p>
    <p class="consent" id="texteConsent"></p>
    <p class="consent-lien"><a href="confidentialite.html" data-t="politique">Politique de confidentialité</a></p>
  </div>

  <div class="ecran-confirmation" id="ecranConfirmation">
    <div class="soleil-ok"><svg viewBox="0 0 191 178" aria-hidden="true"><use href="#i-soleil"/></svg></div>
    <p class="conf-titre" id="confTitre"></p>
    <div class="code" id="codeAffiche">——————</div>
    <div class="gestes-code">
      <button type="button" class="geste-code" data-code-copier data-code-source="codeAffiche" data-fait="Copié" data-t="copiercmd">Copier le code</button>
      <button type="button" class="geste-code" data-code-cartel data-code-source="codeAffiche" data-titre="Ma commande" data-t="gardercmd">Garder en image</button>
    </div>
    <p class="instructions" id="confInstr"></p>
    <p class="note-partielle" id="partielCmd" style="display:none"></p>
    <div class="apres"><button class="bouton-confirmer cache" id="btnPayerCmd" data-t="payerMaintenant">Payer maintenant</button></div>
    <p class="erreur" id="erreurPayerCmd" role="alert" aria-live="polite"></p>
  </div>
</div>

<footer class="pied">
  <a href="confidentialite.html" data-t="mentions">Mentions légales</a>
</footer>

<!-- ══════════════ Super-nav + menu déroulant + toast ══════════════ -->

  <div id="sections"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function () {
  'use strict';

  var T = {
    fr: {
      titre: 'La carte', voirCommande: 'Voir ma commande', maCommande: 'Ma commande', total: 'Total',
      refuseGarde: "Envoi impossible pour le moment. Réessaie dans un instant.",
      tonNom: "Ton nom (pour t'appeler)", tonTel: 'Ton numéro', pNom: 'Ton prénom',
      etPaiement: 'Paiement', mentionPaiement: 'Paiement sécurisé via KkiaPay.',
      payer: 'Payer', commander: 'Commander', onEnvoie: 'On envoie…',
      momo: 'MTN MoMo', moov: 'Moov Money', carte: 'Carte bancaire',
      cashComptoir: 'Au comptoir', cashTable: 'À la table',
      sousEmporter: "Commande sans compte — on t'appelle quand c'est prêt.",
      sousSurplace: "À ta table · on t'apporte ça directement.",
      badgeEmporter: 'À emporter', badgeTable: 'Sur place',
      sousPanneauEmporter: 'Vérifie, puis passe commande.',
      sousPanneauSurplace: 'Service à la table.',
      confTitreEmporter: "C'est commandé. La cuisine s'y met.",
      confTitreSurplace: "C'est noté. On s'occupe de toi.",
      confInstrEmporter: "Donne ce code au comptoir. On t'appelle par ton prénom quand c'est prêt.",
      confInstrSurplace: 'Ta commande arrive à ta table. Ce code, c\'est ton reçu.',
      manqueContact: 'Indique ton prénom et un numéro valide.',
      menuVide: "La carte n'est pas disponible pour le moment.",
      rupture: 'Épuisé', monnaie: 'FCFA',
      partiel: function (l) { return 'À ajouter au comptoir : ' + l + '.'; },
      toastVerbe: function (v) { return v + ' arrive bientôt.'; },
      toastNu: 'Le mode NU (communauté) arrive bientôt.',
      mentions: 'Mentions légales',
      politique: 'Politique de confidentialité',
      saut: 'Aller au contenu',
      phase: 'Version d\'essai. Des fonctions sont incomplètes ou indisponibles.',
      fCode: 'Six signes, lettres et chiffres — par exemple ABC123.',
      copiercmd: 'Copier le code', gardercmd: 'Garder en image',
      payerMaintenant: 'Payer maintenant', onOuvre: 'On ouvre le paiement…',
      payerFerme: 'Le paiement en ligne n’est pas disponible. Tu peux régler au comptoir.'
    },
    en: {
      titre: 'Menu', voirCommande: 'View my order', maCommande: 'My order', total: 'Total',
      refuseGarde: 'Sorry, there is a technical problem. Try again in a few moments.',
      tonNom: 'Your name', tonTel: 'Your number', pNom: 'Your first name',
      etPaiement: 'Payment', mentionPaiement: 'Payments are processed securely by KkiaPay.',
      payer: 'Pay', commander: 'Place order', onEnvoie: 'Sending…',
      momo: 'MTN MoMo', moov: 'Moov Money', carte: 'Bank card',
      cashComptoir: 'At the counter', cashTable: 'At the table',
      sousEmporter: 'No account needed. We will call you when it is ready.',
      sousSurplace: 'Table service · we will bring it to you.',
      badgeEmporter: 'Takeaway', badgeTable: 'Table service',
      sousPanneauEmporter: 'Check your order, then place it.',
      sousPanneauSurplace: 'Table service.',
      confTitreEmporter: 'Order placed. The kitchen has it.',
      confTitreSurplace: 'Order placed. We are on it.',
      confInstrEmporter: 'Show this code at the counter. We will call your name when it is ready.',
      confInstrSurplace: 'Your order is on its way to your table. This code is your receipt.',
      manqueContact: 'Enter your first name and a valid phone number.',
      menuVide: 'The menu is unavailable right now.',
      rupture: 'Sold out', monnaie: 'FCFA',
      partiel: function (l) { return 'Ask at the counter for: ' + l + '.'; },
      toastVerbe: function (v) { return v + ' is coming soon.'; },
      toastNu: 'NU, the community side of Roots, is coming soon.',
      mentions: 'Legal notices',
      politique: 'Privacy Policy',
      saut: 'Skip to content',
      phase: 'Trial version. Some features are incomplete.',
      fCode: 'Six characters, letters and numbers. For example ABC123.',
      copiercmd: 'Copy code', gardercmd: 'Save as image',
      payerMaintenant: 'Pay', onOuvre: 'Opening payment…',
      payerFerme: 'Online payment is unavailable. You can pay at the counter.'
    }
  };

  var VERBES = { plan: 'Plan', roots: 'Roots', roam: 'Roam' };

  /* ---------- Contexte : QR de table → service à la table ---------- */

  var params = new URLSearchParams(location.search);
  /* Le QR d'une table porte un jeton opaque. La base seule sait à quelle table
     il correspond, et refuse toute valeur qui ne vient pas d'elle : l'écran ne
     juge donc pas la forme du jeton, il le transmet tel quel. Le numéro de
     table ne circule plus, et ne s'affiche plus — il n'est pas connu ici. */
  var jetonTable = (params.get('table') || '').trim().slice(0, 128) || null;
  var service = jetonTable ? 'sur_place' : 'emporter';

  var langue = Roots.langueRetenue(Roots.langueParDefaut());

  var $ = function (id) { return document.getElementById(id); };
  function t() { return T[langue]; }
  function fmt(n) { return Number(n || 0).toLocaleString(langue === 'fr' ? 'fr-FR' : 'en-US'); }
  function prix(n) { return fmt(n) + ' ' + t().monnaie; }
  function nomDe(o) { return langue === 'en' ? (o.nom_en || o.nom_fr) : (o.nom_fr || o.nom_en); }
  function descDe(o) { return langue === 'en' ? (o.desc_en || o.desc_fr) : (o.desc_fr || o.desc_en); }

  /* ---------- État ---------- */

  var CATEGORIES = [];
  var ARTICLES = {};
  var panier = {};
  var moyenPaiement = jetonTable ? 'cash' : 'momo';
  var notice = null;
  var iti = null;

  /* ---------- Chrome ---------- */

  var chromeUI = Roots.initChrome({
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    toastVerbe: function (l, libelle) { return T[l].toastVerbe(libelle); },
    verbes: VERBES
  });

  /* ---------- Messages inline ---------- */

  function montrerErreur(id, msg) { var e = $(id); e.textContent = msg; e.classList.add('visible'); }
  function cacherErreur(id) { var e = $(id); e.textContent = ''; e.classList.remove('visible'); }

  /* ---------- Notice de traitement ----------
     Elle reste affichée au-dessus du bouton : c'est la validation qui vaut
     acceptation. Si la notice ne le dit pas elle-même, l'écran l'énonce. */

  /* La notice du socle fait foi : c'est SA version qui est scellee avec le
     consentement. L'ecran n'ajoute sa phrase que si la notice ne la dit pas —
     sinon il afficherait des mots que la version enregistree ne couvre pas. */
  function texteNotice(n) { return Roots.db.texteNotice(n, langue); }

  /* ---------- Contexte appliqué au DOM ---------- */

  function appliquerContexte() {
    var badge = $('badgeContexte');
    badge.innerHTML = '';
    var pastille = document.createElement('span');
    if (service === 'sur_place') {
      pastille.className = 'badge-table';
      pastille.innerHTML = '<svg class="i"><use href="#i-table"/></svg><span class="lib"></span>';
      pastille.querySelector('.lib').textContent = t().badgeTable;
      $('sousTitre').textContent = t().sousSurplace;
      $('sousPanneau').textContent = t().sousPanneauSurplace;
      $('champsEmporter').style.display = 'none';
    } else {
      pastille.className = 'badge-emporter';
      pastille.innerHTML = '<svg class="i"><use href="#i-sac"/></svg><span class="lib"></span>';
      pastille.querySelector('.lib').textContent = t().badgeEmporter;
      $('sousTitre').textContent = t().sousEmporter;
      $('sousPanneau').textContent = t().sousPanneauEmporter;
      $('champsEmporter').style.display = 'block';
    }
    badge.appendChild(pastille);
  }

  /* ---------- Onglets = ancres de saut ---------- */

  function dessinerCategories() {
    var z = $('categories');
    z.innerHTML = '';
    CATEGORIES.forEach(function (cat) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat';
      b.dataset.cat = cat.ancre;
      b.textContent = nomDe(cat);
      b.addEventListener('click', function () {
        activerOnglet(cat.ancre);
        var s = $('sec-' + cat.ancre);
        if (!s) return;
        var calme = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        s.scrollIntoView({ behavior: calme ? 'auto' : 'smooth' });
      });
      z.appendChild(b);
    });
    Roots.glisser(z);
    majOngletActif();
  }

  function activerOnglet(ancre) {
    var boutons = document.querySelectorAll('.cat');
    Array.prototype.forEach.call(boutons, function (b) {
      b.classList.toggle('actif', b.dataset.cat === ancre);
    });
  }

  function majOngletActif() {
    if (!CATEGORIES.length) return;
    /* Sous la pile collante : ce qui passe au-dessus de cette ligne est
       cache par l'en-tete et la bande de categories. */
    var bande = $('categories');
    var ligne = bande ? bande.getBoundingClientRect().bottom + 1 : 0;
    var courant = CATEGORIES[0].ancre;
    var sections = document.querySelectorAll('.section-menu');
    Array.prototype.forEach.call(sections, function (s) {
      if (s.getBoundingClientRect().top <= ligne) courant = s.id.slice(4);
    });
    activerOnglet(courant);
  }

  var defilementPrevu = false;
  window.addEventListener('scroll', function () {
    if (defilementPrevu) return;
    defilementPrevu = true;
    requestAnimationFrame(function () { majOngletActif(); defilementPrevu = false; });
  }, { passive: true });

  /* ---------- Liste du menu ---------- */

  function dessinerMenu() {
    var z = $('listeMenu');
    z.innerHTML = '';
    if (!CATEGORIES.length) {
      var vide = document.createElement('p');
      vide.className = 'vide-menu';
      vide.textContent = t().menuVide;
      z.appendChild(vide);
      return;
    }
    CATEGORIES.forEach(function (cat) {
      var sec = document.createElement('section');
      sec.className = 'section-menu';
      sec.id = 'sec-' + cat.ancre;
      var h3 = document.createElement('h3');
      h3.textContent = nomDe(cat);
      sec.appendChild(h3);
      cat.articles.forEach(function (a) { sec.appendChild(ligneArticle(a)); });
      z.appendChild(sec);
    });
    majOngletActif();
  }

  function ligneArticle(a) {
    var dispo = a.dispo !== false;
    var q = panier[a.id] || 0;
    var el = document.createElement('div');
    el.className = 'article' + (dispo ? '' : ' rupture');
    var infos = document.createElement('div');
    infos.className = 'infos';
    var nom = document.createElement('div');
    nom.className = 'nom';
    nom.textContent = nomDe(a);
    infos.appendChild(nom);
    var d = descDe(a);
    if (d) {
      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = d;
      infos.appendChild(desc);
    }
    var p = document.createElement('div');
    p.className = 'prix';
    p.textContent = prix(a.prix);
    infos.appendChild(p);
    el.appendChild(infos);

    if (!dispo) {
      var tag = document.createElement('span');
      tag.className = 'etiquette-rupture';
      tag.textContent = t().rupture;
      el.appendChild(tag);
      return el;
    }
    if (q === 0) {
      var plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'btn-plus';
      plus.setAttribute('aria-label', '+');
      plus.innerHTML = '<svg class="i"><use href="#i-plus"/></svg>';
      plus.addEventListener('click', function () { ajouter(a.id, 1); });
      el.appendChild(plus);
    } else {
      var st = document.createElement('div');
      st.className = 'stepper';
      var bm = document.createElement('button');
      bm.type = 'button';
      bm.setAttribute('aria-label', '−');
      bm.innerHTML = '<svg class="i"><use href="#i-minus"/></svg>';
      bm.addEventListener('click', function () { ajouter(a.id, -1); });
      var val = document.createElement('span');
      val.textContent = q;
      var bp = document.createElement('button');
      bp.type = 'button';
      bp.setAttribute('aria-label', '+');
      bp.innerHTML = '<svg class="i"><use href="#i-plus"/></svg>';
      bp.addEventListener('click', function () { ajouter(a.id, 1); });
      st.appendChild(bm); st.appendChild(val); st.appendChild(bp);
      el.appendChild(st);
    }
    return el;
  }

  function ajouter(id, delta) {
    var q = (panier[id] || 0) + delta;
    if (q <= 0) delete panier[id]; else panier[id] = Math.min(50, q);
    dessinerMenu();
    majPanier();
  }

  /* ---------- Panier ----------
     Le total est lu sur les prix de la carte : il sert l'affichage, jamais l'envoi. */

  function totalPanier() {
    var s = 0;
    Object.keys(panier).forEach(function (id) {
      var a = ARTICLES[id];
      if (a) s += a.prix * panier[id];
    });
    return s;
  }

  function qtePanier() {
    var s = 0;
    Object.keys(panier).forEach(function (id) { s += panier[id]; });
    return s;
  }

  function majPanier() {
    var qte = qtePanier();
    $('barrePanier').classList.toggle('cachee', qte === 0);
    $('badgeQte').textContent = qte;
    $('barreTotal').textContent = prix(totalPanier());
    majBoutonCommander();
  }

  var panneau = $('panneau'), voile = $('voile');

  function ouvrir() {
    var z = $('lignesPanier');
    z.innerHTML = '';
    Object.keys(panier).forEach(function (id) {
      var a = ARTICLES[id];
      if (!a) return;
      var l = document.createElement('div');
      l.className = 'ligne-panier';
      l.innerHTML = '<span><span class="n"></span> <span class="qte"></span></span><span class="montant"></span>';
      l.querySelector('.n').textContent = nomDe(a);
      l.querySelector('.qte').textContent = '× ' + panier[id];
      l.querySelector('.montant').textContent = prix(a.prix * panier[id]);
      z.appendChild(l);
    });
    $('panneauTotal').textContent = prix(totalPanier());
    dessinerPaiements();
    panneau.classList.add('visible');
    voile.classList.add('visible');
  }

  function fermer() { panneau.classList.remove('visible'); voile.classList.remove('visible'); }

  $('barrePanier').addEventListener('click', ouvrir);
  $('btnFermer').addEventListener('click', fermer);
  voile.addEventListener('click', fermer);

  /* ---------- Paiement ----------
     Le choix est un choix affiché : le navigateur ne décide d'aucun statut. */

  function moyensDispo() {
    return {
      momo: t().momo, moov: t().moov, carte: t().carte,
      cash: service === 'sur_place' ? t().cashTable : t().cashComptoir
    };
  }

  function dessinerPaiements() {
    var z = $('paiements');
    var moyens = moyensDispo();
    if (!moyens[moyenPaiement]) moyenPaiement = 'momo';
    z.innerHTML = '';
    Object.keys(moyens).forEach(function (id) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip-p' + (id === moyenPaiement ? ' actif' : '');
      b.setAttribute('aria-pressed', id === moyenPaiement ? 'true' : 'false');
      b.textContent = moyens[id];
      b.addEventListener('click', function () { moyenPaiement = id; dessinerPaiements(); });
      z.appendChild(b);
    });
    majBoutonCommander();
  }

  function majBoutonCommander() {
    var b = $('btnCommander');
    if (b.classList.contains('occupe')) return;
    b.textContent = moyenPaiement === 'cash' ? t().commander : t().payer + ' ' + prix(totalPanier());
    b.disabled = !qtePanier() || !notice;
  }

  /* ---------- Commande ---------- */

  function numeroDe(input) {
    if (iti && typeof iti.getNumber === 'function') {
      var v = iti.getNumber();
      if (v) return v;
    }
    return (input.value || '').trim();
  }

  function numeroValide(input) {
    if (iti && typeof iti.isValidNumber === 'function' && input.value.trim()) {
      var r = iti.isValidNumber();
      if (r !== null && typeof r !== 'undefined') return !!r;
    }
    return numeroDe(input).replace(/\D/g, '').length >= 8;
  }

  var envoiEnCours = false;
  var gardeCmd = Roots.garde($('btnCommander').parentNode, 'complement');

  async function commander() {
    if (envoiEnCours) return;
    cacherErreur('erreurCmd');
    if (gardeCmd.pris()) return montrerErreur('erreurCmd', t().refuseGarde);
    var lignes = Object.keys(panier);
    if (!lignes.length) return;

    var nom = null, tel = null;
    if (service === 'emporter') {
      nom = $('nom').value.trim();
      if (!nom || !numeroValide($('telephone'))) return montrerErreur('erreurCmd', t().manqueContact);
      tel = numeroDe($('telephone'));
    }
    if (!notice) return;

    envoiEnCours = true;
    var b = $('btnCommander');
    b.classList.add('occupe');
    b.disabled = true;
    b.textContent = t().onEnvoie;
    try {
      await gardeCmd.patienter();
      var r = await Roots.db.ouvrirCommande({
        table: jetonTable,
        nom: nom, tel: tel, service: service,
        consentement: notice.version
      });
      var manquants = [];
      for (var i = 0; i < lignes.length; i++) {
        var id = lignes[i];
        try {
          await Roots.db.ajouterArticle(r.id, r.jeton, id, panier[id]);
        } catch (e2) {
          var a = ARTICLES[id];
          manquants.push(a ? nomDe(a) : id);
        }
      }
      confirmer(r, manquants);
    } catch (e) {
      montrerErreur('erreurCmd', e.message);
    } finally {
      envoiEnCours = false;
      b.classList.remove('occupe');
      majBoutonCommander();
    }
  }

  /* Le paiement d'une commande. La porte exige l'identifiant ET le jeton, que
     seul le navigateur qui vient de passer la commande detient : la porte de
     consultation par code ne les rend jamais. Le geste vit donc ici, et sur
     aucun ecran ou l'on arrive avec un code seul. Le montant vient de la
     porte, jamais du panier affiche. */
  var commandeOuverte = null;
  var paiementEnCours = false;

  async function payerCmd() {
    if (paiementEnCours || !commandeOuverte) return;
    cacherErreur('erreurPayerCmd');
    var b = $('btnPayerCmd');
    paiementEnCours = true;
    b.disabled = true;
    var libelle = b.textContent;
    b.textContent = t().onOuvre;
    try {
      var r = await Roots.db.initierPaiementCommande(commandeOuverte.id, commandeOuverte.jeton);
      var pose = Roots.db.remisePaiement({
        paiement: r.paiement, montant: r.montant, type: 'commande'
      });
      if (!pose) { montrerErreur('erreurPayerCmd', t().payerFerme); return; }
      location.assign('payer.html');
    } catch (e) {
      montrerErreur('erreurPayerCmd', e.message);
    } finally {
      paiementEnCours = false;
      b.disabled = false;
      b.textContent = libelle;
    }
  }
  $('btnPayerCmd').addEventListener('click', payerCmd);

  function confirmer(r, manquants) {
    $('vueCommande').style.display = 'none';
    $('codeAffiche').textContent = (r && r.code) || '——————';
    commandeOuverte = (r && r.id && r.jeton) ? { id: r.id, jeton: r.jeton } : null;
    /* Le bouton ne se montre pas quand la vente s'est reglee au comptoir : il
       proposerait un second paiement, et la porte le refuserait. */
    $('btnPayerCmd').classList.toggle('cache',
      !commandeOuverte || moyenPaiement === 'cash' || !Roots.db.reglagePaiement().pose);
    cacherErreur('erreurPayerCmd');
    $('confTitre').textContent = service === 'sur_place' ? t().confTitreSurplace : t().confTitreEmporter;
    $('confInstr').textContent = service === 'sur_place'
      ? t().confInstrSurplace : t().confInstrEmporter;
    if (manquants && manquants.length) {
      $('partielCmd').textContent = t().partiel(manquants.join(', '));
      $('partielCmd').style.display = 'block';
    } else {
      $('partielCmd').style.display = 'none';
    }
    $('ecranConfirmation').classList.add('visible');
    panneau.scrollTop = 0;
  }

  /* ---------- Langue ---------- */

  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-p]').forEach(function (el) {
      var v = t()[el.getAttribute('data-p')];
      if (typeof v === 'string') el.placeholder = v;
    });
    document.title = 'Mi Roots — ' + t().titre;
    $('btnLangue').textContent = langue === 'fr' ? 'EN' : 'FR';
    if (notice) $('texteConsent').textContent = texteNotice(notice);
    appliquerContexte();
    dessinerCategories();
    dessinerMenu();
    majPanier();
    if (panneau.classList.contains('visible')) ouvrir();
    chromeUI.dessinerSections();
  }

  /* ---------- Chargement ---------- */

  async function chargerCarte() {
    var d = await Roots.db.carte();
    var parCat = {};
    (d.articles || []).forEach(function (a) {
      ARTICLES[a.id] = a;
      (parCat[a.categorie_id] = parCat[a.categorie_id] || []).push(a);
    });
    CATEGORIES = (d.categories || [])
      .slice()
      .sort(function (x, y) { return (x.ordre || 0) - (y.ordre || 0); })
      .map(function (c) {
        return {
          id: c.id, ancre: c.slug || c.id, nom_fr: c.nom_fr, nom_en: c.nom_en,
          articles: (parCat[c.id] || []).slice().sort(function (x, y) { return (x.ordre || 0) - (y.ordre || 0); })
        };
      })
      /* Une catégorie sans article visible ne s'affiche pas. */
      .filter(function (c) { return c.articles.length > 0; });
    dessinerCategories();
    dessinerMenu();
  }

  async function demarrer() {
    try {
      await chargerCarte();
      cacherErreur('erreurCarte');
    } catch (e) {
      montrerErreur('erreurCarte', e.message);
    }
    try {
      notice = await Roots.db.notice('commande');
      if (notice) $('texteConsent').textContent = texteNotice(notice);
    } catch (e) {
      montrerErreur('erreurCmd', e.message);
    }
    majPanier();
  }

  /* ---------- Câblage des gestes ---------- */

  $('btnCommander').addEventListener('click', commander);
  $('btnLangue').addEventListener('click', function () {
    langue = langue === 'fr' ? 'en' : 'fr';
    Roots.retenirLangue(langue);
    appliquerLangue();
  });

  appliquerLangue();
  demarrer();

  window.addEventListener('load', function () {
    if (service === 'emporter') iti = Roots.initTelRoots($('telephone'));
  });
})();
</script>
</body>
</html>
