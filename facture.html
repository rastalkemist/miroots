<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     LA REMISE DE LA PIECE, en trois temps.
     1. Le choix : « Télécharger » pose le canal sur la vente. Ce choix
        appartient au client et se rejoue librement.
     2. La capacité : la porte rend un jeton quand la pièce est scellée ;
        c'est lui, et lui seul, qui ouvre la lecture.
     3. Le rendu : la pièce est composée sur le modèle des factures
        normalisées remises par le SFE en ligne — mêmes blocs, même ordre,
        mêmes libellés, éléments de sécurité et QR compris. Le document
        est en français quelle que soit la langue de l'écran : c'est la
        langue de la pièce, l'écran autour se traduit.
     L'écran ne calcule aucun montant ; il rend ce que la porte rend.
     Une pièce d'essai se dit : l'environnement est scellé sur la pièce.
     ------------------------------------------------------------------ */
  var T = {
    fr: {
      saut: 'Aller au contenu',
      h1: 'Ma facture',
      politique: 'Politique de confidentialité',
      essai: 'Pièce d’essai — émise sur la plateforme de test de la DGI. Elle n’a pas de valeur fiscale.',
      verifier: 'Vérifier cette pièce',
      refAchat: 'Réf. achat',
      retrouver: { commande: 'Retrouver ma commande', reservation: 'Retrouver ma réservation' },
      surAppareil: {
        commande: 'La facture se remet sur l’appareil qui a servi à payer. Passe au comptoir avec ton code.',
        reservation: 'La facture se remet sur l’appareil qui a servi à payer. Retrouve ta réservation avec ton code et ton numéro, ou passe au comptoir.'
      },
      etapes: {
        choix: {
          titre: 'Ta facture',
          dit: 'Elle est établie sur la plateforme de facturation, puis remise ici. Elle reste disponible tant que tu gardes ton code.',
          action: 'Télécharger ma facture', second: 'Retrouver ma réservation'
        },
        en_cours: {
          titre: 'Ta facture s’établit',
          dit: 'Ton paiement est bien enregistré. La pièce est en cours d’établissement — cela prend quelques minutes.',
          action: 'Vérifier à nouveau', second: 'Retrouver ma réservation'
        },
        en_cours_long: {
          titre: 'Cela prend plus longtemps que prévu',
          dit: 'Ton paiement est bien enregistré et ta facture n’est pas perdue : elle n’est pas encore revenue de la plateforme de facturation. Réessaie plus tard, ou passe au comptoir avec ton code — l’équipe la retrouvera.',
          action: 'Vérifier à nouveau', second: 'Retrouver ma réservation'
        },
        prete: {
          titre: 'Ta facture',
          dit: '',
          action: 'Télécharger (PDF)', second: 'Retrouver ma réservation'
        },
        absente: {
          titre: 'On ne retrouve pas ta vente',
          dit: 'La facture se remet sur l’appareil qui a servi à payer. Retrouve ta réservation avec ton code et ton numéro, ou passe au comptoir.',
          action: 'Retour à l’accueil', second: 'Retrouver ma réservation'
        }
      }
    },
    en: {
      saut: 'Skip to content',
      h1: 'My invoice',
      politique: 'Privacy Policy',
      essai: 'Test document, issued on the tax authority test platform. It has no fiscal value.',
      verifier: 'Verify this document',
      refAchat: 'Purchase ref.',
      retrouver: { commande: 'Find my order', reservation: 'Find my booking' },
      surAppareil: {
        commande: 'Invoices are issued to the device used to pay. Bring your code to the counter and the team will retrieve it.',
        reservation: 'Invoices are issued to the device used to pay. Find your booking with your code and phone number, or ask at the counter.'
      },
      etapes: {
        choix: {
          titre: 'Your invoice',
          dit: 'Your invoice is issued through the tax authority platform and delivered here. It remains available for as long as you keep your code.',
          action: 'Download my invoice', second: 'Find my booking'
        },
        en_cours: {
          titre: 'Your invoice is being issued',
          dit: 'Your payment has been recorded. The invoice is being issued, which takes a few minutes.',
          action: 'Check again', second: 'Find my booking'
        },
        en_cours_long: {
          titre: 'This is taking longer than expected',
          dit: 'Your payment has been recorded and your invoice is not lost. It has not yet returned from the invoicing platform. Check again later, or bring your code to the counter and the team will retrieve it.',
          action: 'Check again', second: 'Find my booking'
        },
        prete: {
          titre: 'Your invoice',
          dit: '',
          action: 'Download (PDF)', second: 'Find my booking'
        },
        absente: {
          titre: 'We cannot find that sale',
          dit: 'Invoices are issued to the device used to pay. Find your booking with your code and phone number, or ask at the counter.',
          action: 'Back to home', second: 'Find my booking'
        }
      }
    }
  };

  /* Les six groupes de taxe publiés par la DGI, avec leurs étiquettes. Ils se
     relèvent sur la table du socle, pas sur une lettre supposée : une lettre
     nue ne se relit pas. Un code absent de cette table s'affiche tel quel. */
  var GROUPES = {
    A: 'A - EXO', B: 'B - TAX', C: 'C - EXP',
    D: 'D - MP',  E: 'E - TPS', F: 'F - RES'
  };

  /* Les moyens d'encaissement du socle, dans le vocabulaire que la pièce
     porte devant la plateforme : les deux opérateurs de monnaie électronique
     y sont un seul et même moyen. La liste vient du code qui l'exerce, non
     d'une note qui le résume. */
  var MOYENS = {
    espece: 'ESPECES', momo: 'MOBILE MONEY', moov: 'MOBILE MONEY',
    carte: 'CARTE BANCAIRE', autre: 'AUTRE'
  };

  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }
  var $ = function (id) { return document.getElementById(id); };

  /* Les nombres de la pièce suivent le format des factures du SFE en ligne :
     milliers séparés par un point, francs entiers. */
  function fmtF(n) {
    return String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function d2(n) { return (n < 10 ? '0' : '') + n; }
  function dateDoc(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d2(d.getDate()) + '/' + d2(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function heureDoc(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return dateDoc(iso) + ' ' + d2(d.getHours()) + ':' + d2(d.getMinutes()) + ':' + d2(d.getSeconds());
  }

  /* Deux parcours, retrouvés comme sur l'écran de paiement : une réservation
     par la remise de l'écran d'encaissement, une commande par le jeton gardé
     sur cet appareil. */
  var remise = null;
  try {
    var brutRemise = sessionStorage.getItem('roots_remise_paiement');
    if (brutRemise) remise = JSON.parse(brutRemise);
  } catch (e) { remise = null; }

  var vente = null;

  if (remise && remise.code && remise.tel &&
      String(remise.type || '').indexOf('reservation') === 0) {
    vente = {
      mode: 'reservation',
      type: (remise.type === 'reservation_logement') ? 'logement' : 'espace',
      code: remise.code, tel: remise.tel
    };
  } else {
    var cmd = Roots.db.derniereCommande();
    if (cmd) vente = { mode: 'commande', id: cmd.id, jeton: cmd.jeton, code: cmd.code };
  }

  var etape = vente ? 'choix' : 'absente';
  var facture = null;

  /* LA PROMESSE SE PLAFONNE. La porte de remise rend « en cours » pour cinq
     situations differentes, dont une piece qui ne viendra jamais : l'ecran ne
     peut donc pas savoir laquelle. Passe trois verifications infructueuses, il
     cesse de promettre quelques minutes — sans nommer une cause qu'il ignore.
     Le compte vit dans l'onglet : qui revient le lendemain repart a zero. */
  var SEUIL_ATTENTE = 3;
  var essais = 0;

  function attente() {
    essais += 1;
    return essais >= SEUIL_ATTENTE ? 'en_cours_long' : 'en_cours';
  }

  function montrer(cle) {
    etape = cle;
    var e = t().etapes[cle];
    $('panneau').setAttribute('data-etape', cle);
    $('titre').textContent = e.titre;
    $('dit').textContent = e.dit;
    $('dit').classList.toggle('cache', !e.dit);
    $('action').textContent = e.action;
    $('second').textContent = t().retrouver[vente ? vente.mode : 'reservation'];
    $('second').classList.remove('cache');
    if (cle === 'absente') $('dit').textContent = t().surAppareil[vente ? vente.mode : 'reservation'];
    $('piece').classList.toggle('cache', cle !== 'prete');
    $('essai').classList.toggle('cache',
      cle !== 'prete' || !facture || facture.environnement !== 'test');
    if (facture && facture.environnement === 'test') $('essai').textContent = t().essai;
    if (cle === 'prete' && facture) dessiner(facture);
  }

  function erreur(msg) { var e = $('erreur'); e.textContent = msg; e.classList.remove('cache'); }
  function cacherErreur() { $('erreur').classList.add('cache'); }

  function el(tag, classe, texte) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texte !== undefined && texte !== null) n.textContent = texte;
    return n;
  }
  function tr(cellules, enTete) {
    var r = document.createElement('tr');
    cellules.forEach(function (c) {
      var d = document.createElement(enTete ? 'th' : 'td');
      if (c && typeof c === 'object') { d.textContent = c.v; if (c.classe) d.className = c.classe; }
      else d.textContent = (c === undefined || c === null) ? '' : c;
      r.appendChild(d);
    });
    return r;
  }

  /* Le QR rend, en image, la donnée exacte que la plateforme a scellée sur la
     pièce. Il n'est composé d'aucune autre source. */
  function imageQr(donnee) {
    try {
      var q = qrcode(0, 'M');
      q.addData(String(donnee));
      q.make();
      return q.createDataURL(4, 8);
    } catch (e) { return null; }
  }

  /* La pièce, composée sur le modèle des factures du SFE en ligne : en-tête
     vendeur et cartouche de la pièce, boîtes adresse et client, montants,
     lignes, ventilation des impôts, répartition des paiements, éléments de
     sécurité. Les blocs viennent de la porte, dans cet ordre. */
  function dessiner(f) {
    var z = $('piece'); z.innerHTML = '';
    var v = f.vendeur || {}, c = f.client || {}, tt = f.totaux || {}, s = f.securite || {};

    var entete = el('header', 'entete-doc');
    var gauche = el('div', 'v-id');
    gauche.appendChild(el('p', 'v-nom', (v.nom || '').toUpperCase()));
    gauche.appendChild(el('p', 'v-ifu', 'IFU : ' + (v.ifu || '')));
    var droite = el('div', 'f-id');
    droite.appendChild(el('p', 'f-type', f.type || 'FACTURE DE VENTE'));
    droite.appendChild(el('p', null, 'Facture # ' + (f.numero || '')));
    /* La reference de l'achat est une mention COMPTABLE, pas fiscale : elle
       ne se mele jamais aux champs scelles. Sa place est entre le numero et
       la date, le geste par lequel on identifie une piece. Le bloc `vente`
       est ABSENT d'une piece non scellee, et son code peut etre nul si la
       vente a ete effacee : on n'affiche alors aucun libelle. */
    if (f.vente && f.vente.code) {
      droite.appendChild(el('p', null, t().refAchat + ' : ' + f.vente.code));
    }
    droite.appendChild(el('p', null, 'Date : ' + dateDoc(f.date)));
    droite.appendChild(el('p', null, 'Vendeur : SFE en ligne'));
    entete.appendChild(gauche); entete.appendChild(droite);
    z.appendChild(entete);

    var boites = el('div', 'boites-doc');
    var bv = el('table', 'boite-doc');
    bv.appendChild(tr([{ v: 'Adresse', classe: 'lib' }, v.adresse || '']));
    bv.appendChild(tr([{ v: 'Contact', classe: 'lib' }, v.contact || '']));
    bv.appendChild(tr([{ v: 'VMCF', classe: 'lib' }, v.nim || '']));
    var bc = el('table', 'boite-doc boite-client');
    var cap = el('caption', null, 'CLIENT');
    bc.appendChild(cap);
    bc.appendChild(tr([{ v: 'Nom', classe: 'lib' }, c.nom || '']));
    bc.appendChild(tr([{ v: 'IFU', classe: 'lib' }, c.ifu || '']));
    bc.appendChild(tr([{ v: 'Adresse', classe: 'lib' }, '']));
    bc.appendChild(tr([{ v: 'Contact', classe: 'lib' }, '']));
    boites.appendChild(bv); boites.appendChild(bc);
    z.appendChild(boites);

    var monts = el('div', 'montants-doc');
    monts.appendChild(el('p', null, 'TTC : ' + fmtF(tt.ttc) + ' f'));
    monts.appendChild(el('p', null, 'AIB : ' + fmtF(tt.aib) + ' f'));
    monts.appendChild(el('p', 'net', 'NET A PAYER : ' + fmtF(tt.net_a_payer) + ' f'));
    z.appendChild(monts);

    var tl = el('table', 'table-doc t-lignes');
    tl.appendChild(tr(['#', { v: 'Nom', classe: 'gauche' }, 'Prix unitaire', 'Quantité', 'Montant T.T.C.'], true));
    (f.lignes || []).forEach(function (l) {
      tl.appendChild(tr([
        l.rang, { v: l.nom, classe: 'gauche' }, fmtF(l.prix_unitaire),
        fmtF(l.quantite), fmtF(l.montant) + ' [' + (l.groupe || '') + ']'
      ]));
    });
    z.appendChild(tl);

    z.appendChild(el('p', 'sep-doc', '--- VENTILATION DES IMPÔTS ---'));
    var vt = el('div', 'vent-doc');
    var tv = el('table', 'table-doc t-vent');
    tv.appendChild(tr(['Groupe', 'Total', 'Imposable', 'Impôt'], true));
    (f.ventilation || []).forEach(function (g) {
      tv.appendChild(tr([
        { v: GROUPES[g.groupe] || g.groupe || '', classe: 'gauche' }, fmtF(g.total),
        (g.imposable === null || g.imposable === undefined) ? '-' : fmtF(g.imposable),
        (g.impot === null || g.impot === undefined) ? '-' : fmtF(g.impot)
      ]));
    });
    vt.appendChild(tv);
    vt.appendChild(el('div', 'total-doc', 'Total : ' + fmtF(tt.ttc)));
    z.appendChild(vt);

    z.appendChild(el('p', 'sep-doc', '--- RÉPARTITION DES PAIEMENTS ---'));
    var tp = el('table', 'table-doc t-paie');
    tp.appendChild(tr([{ v: 'Type de paiement', classe: 'gauche' }, 'Payé'], true));
    (f.paiements || []).forEach(function (p) {
      tp.appendChild(tr([{ v: MOYENS[p.type] || String(p.type || '').toUpperCase(), classe: 'gauche' }, fmtF(p.paye)]));
    });
    z.appendChild(tp);

    z.appendChild(el('p', 'sep-doc', '--- ELÉMENTS DE SÉCURITÉ DE LA FACTURE NORMALISÉE ---'));
    var bs = el('div', 'securite-doc');
    var qr = s.qr ? imageQr(s.qr) : null;
    if (qr) {
      var img = document.createElement('img');
      img.className = 'qr-doc';
      img.src = qr;
      img.alt = 'QR code de la facture normalisée';
      bs.appendChild(img);
    }
    var sd = el('div', 'sec-donnees');
    sd.appendChild(el('p', 'sec-lib', 'Code MECeF/DGI'));
    sd.appendChild(el('p', 'sec-code', s.code_mecef || ''));
    var lignesSec = [['MECeF NIM :', s.nim || ''], ['MECeF Compteurs :', s.compteurs || ''],
                     ['MECeF Heure :', heureDoc(s.heure)]];
    lignesSec.forEach(function (l) {
      var p = el('p', 'sec-ligne');
      p.appendChild(el('span', null, l[0]));
      p.appendChild(el('b', null, l[1]));
      sd.appendChild(p);
    });
    bs.appendChild(sd);
    z.appendChild(bs);

    if (s.qr && /^https?:\/\//.test(String(s.qr))) {
      var a = document.createElement('a');
      a.className = 'lien-verif';
      a.href = s.qr;
      a.rel = 'noopener';
      a.textContent = t().verifier;
      z.appendChild(a);
    }
  }

  /* LE CANAL DE REMISE, ET POURQUOI CET ECRAN N'EN OFFRE PAS LE CHOIX.
     Le canal se pose sur la vente, et c'est lui — jamais une adresse connue
     par ailleurs — qui met un envoi en file au scellement de la piece. Un
     canal pose APRES le sceau ne part donc pas au premier tour d'envoi : il
     est rattrape. Le choix appartient a l'ecran qui se tient entre le paiement
     et le sceau ; ici, la piece est prete ou sur le point de l'etre, et cet
     ecran la remet.
     ⚠ CET ECRAN NE PEUT PAS NE PAS POSER DE CANAL : le jeton de la piece n'est
     rendu que par cette porte. Et la porte ECRIT LE DERNIER CHOIX RECU. Poser
     le telechargement sans regarder effacerait donc l'envoi consenti juste
     avant. Le canal deja pose est repris tel quel, avec la version de sa
     notice — la version et le texte ne bougent pas ; seule la date du
     consentement se reecrit, et c'est pourquoi cette porte ne s'appelle pas
     sans necessite. Le canal repris n'est cru que s'il designe la meme vente. */
  var repris = null;
  if (remise && remise.canal === 'courriel' && remise.consentement &&
      (!remise.code || !vente || !vente.code || remise.code === vente.code)) {
    repris = { canal: 'courriel', consentement: remise.consentement };
  }
  var CANAL = repris ? repris.canal : 'telechargement';

  function poserChoix() {
    if (vente.mode === 'reservation') {
      return Roots.db.choisirRemiseReservation({
        type: vente.type, code: vente.code, tel: vente.tel, canal: CANAL,
        consentement: repris ? repris.consentement : null
      });
    }
    return Roots.db.choisirRemiseCommande({
      id: vente.id, jeton: vente.jeton, canal: CANAL,
      consentement: repris ? repris.consentement : null
    });
  }

  function chercherPiece() {
    cacherErreur();
    return poserChoix().then(function (r) {
      if (!r || r.facture !== 'prete' || !r.jeton) { montrer(attente()); return; }
      return Roots.db.consulterFacture(r.jeton).then(function (f) {
        if (f && f.resultat === 'trouvee') { facture = f; montrer('prete'); }
        else montrer(attente());
      });
    }, function (e) { erreur(e.message); });
  }

  /* Le verrou se ferme au premier appui et se rouvre à la réponse : il couvre
     le double appui sur réseau lent. */
  var verrou = false;
  $('action').addEventListener('click', function () {
    if (verrou) return;
    verrou = true;
    $('action').disabled = true;
    Promise.resolve()
      .then(function () { return agir(etape); })
      .then(function () { verrou = false; $('action').disabled = false; });
  });

  function agir(cle) {
    if (cle === 'absente') { location.href = 'index.html'; return; }
    if (cle === 'prete') { window.print(); return; }
    return chercherPiece();
  }

  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (elmt) {
      var v = t()[elmt.getAttribute('data-t')];
      if (typeof v === 'string') elmt.textContent = v;
    });
    montrer(etape);
  }

  var chrome = Roots.initChrome({ toastId: 'toast', getLangue: function () { return langue; }, getSections: Roots.nav });
  $('btnLangue').addEventListener('click', function () {
    langue = (langue === 'fr') ? 'en' : 'fr';
    Roots.retenirLangue(langue);
    $('btnLangue').textContent = (langue === 'fr') ? 'EN' : 'FR';
    appliquerLangue();
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
  });

  appliquerLangue();
})();
</script>
