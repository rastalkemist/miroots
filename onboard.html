<!DOCTYPE html>
<html lang="fr" data-ouverture>
<head>
<!-- emprunt-tronc: p-space corps lang-btn saut-contenu chrome-haut chrome-inner
     chrome-bas chrome-titre chrome-burger chrome-droite ankh-home centre toggle
     mot reste sub switch knob nu i ico-rond verbe menu-pop voile-menu tete
     fermer toast actif garde-banniere — la barre, le tiroir et le bandeau sont
     des pieces d'infrastructure : ils gardent leurs noms et leurs regles, seule
     leur presentation change ici. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; script-src 'self' 'sha256-ZknuCDPLfX3QUDZs2HilqTAKY6sWcTaiJEVHWsVx+fE='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://xrqorebcgnixcbqqeoll.supabase.co; manifest-src 'self'">
<title>Mi Roots — Ouvrir Mi Space</title>
<meta name="description" content="Ouvre ton espace en deux gestes : ton adresse, le code reçu. Personne ne voit ce que tu y poses.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mi Roots">
<meta property="og:title" content="Mi Space">
<meta property="og:description" content="Ouvre ton espace en deux gestes : ton adresse, le code reçu. Personne ne voit ce que tu y poses.">
<meta property="og:locale" content="fr_BJ">
<meta property="og:locale:alternate" content="en_GB">
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.ico" sizes="any">
<link rel="icon" href="icones/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preload" href="fonts/MuseoModerno-var.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="roots-fonts.css">
<link rel="stylesheet" href="roots-tokens.css">
<link rel="stylesheet" href="roots.css">
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="onboard.css">
<script src="roots.js"></script>
<script src="roots-db.js"></script>
<script src="garde.js"></script>
<script src="onboard.js"></script>
</head>
<body class="p-space ouv-page" data-surface="claire">



<a class="saut-contenu" href="#contenu" data-t="saut">Aller au contenu</a>

<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil" data-al-chrome="accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU" data-al-chrome="mode"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="space.html">Space</a>
    </div>
    <div class="chrome-droite">
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-al-chrome="menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<button type="button" class="ouv-langue" id="btnLangue"></button>



<main class="ouv-piece">
  <div class="ouv-tete">
    <p class="ouv-appel" data-t="appel">Ton quotidien, simplifié</p>
  </div>
  <div class="ouv-groupe">
    <h1 class="ouv-titre" data-t="mission">Accomplis ta première mission&nbsp;:</h1>

    <div class="ouv-mission">
      <button type="button" class="ouv-geste" id="mere" aria-describedby="etatMere">
        <span class="ouv-case-mere" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
        <span class="ouv-mot" data-t="tache">Ouvrir mon espace</span>
      </button>


      <div class="ouv-sous">
        <div class="ouv-tache" id="st1">
          <label class="ouv-etiq" for="courriel" data-t="tCourriel">Ton adresse courriel</label>
          <span class="ouv-case" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
          <div class="ouv-rang">
            <input id="courriel" type="email" placeholder="toi@exemple.bj" autocomplete="email" inputmode="email" spellcheck="false" aria-describedby="paroleCourriel">
            <button type="button" class="ouv-go" id="btnCourriel" data-al="envoyer"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
          <p class="ouv-parole" id="paroleCourriel" role="status"></p>
        </div>
        <div class="ouv-tache est-repliee" id="st2">
          <label class="ouv-etiq" for="code" data-t="tCode">Le code reçu dans ta boîte</label>
          <span class="ouv-case" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
          <div class="ouv-rang">
            <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 chiffres" spellcheck="false" aria-describedby="paroleCode">
            <button type="button" class="ouv-go" id="btnCode" data-al="confirmer"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
          <p class="ouv-parole" id="paroleCode" role="status"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="ouv-reste"></div>
</main>

<nav class="chrome-bas" id="superNav">
  <button class="verbe actif" aria-current="true" data-verbe="space" aria-label="Plan"><span class="ico-rond"><svg class="i"><use href="#i-plan"/></svg></span></button>
  <button class="verbe" data-verbe="roots" aria-label="Roots"><span class="ico-rond"><svg class="i"><use href="#i-roots"/></svg></span></button>
  <button class="verbe" data-verbe="roam" aria-label="Roam"><span class="ico-rond"><svg class="i"><use href="#i-roam"/></svg></span></button>
</nav>
<div class="voile-menu" id="voileMenu"></div>
<div class="menu-pop" id="drawer">
  <div class="tete"><button class="fermer" id="fermerMenu" aria-label="Fermer" data-al-chrome="fermer"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="sections"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function () {
  'use strict';

  /* Delai avant qu'un nouveau code puisse partir, en secondes, et nombre
     d'envois au-dela duquel une sortie est proposee. */
  var ATTENTE = 30;
  var AVANT_ISSUE = 3;
  var SUITE = 'confirm.html';

  var T = {
    fr: {
      appel: 'Ton quotidien, simplifié',
      mission: 'Accomplis ta première mission :',
      tache: 'Ouvrir mon espace',
      tCourriel: 'Ton adresse courriel',
      tCode: 'Le code reçu dans ta boîte',
      alEnvoyer: 'Envoyer le code',
      alRenvoyer: 'Envoyer un nouveau code',
      alConfirmer: 'Confirmer le code',
      orienteCourriel: 'Commence par ton adresse courriel.',
      orienteCode: 'Entre le code reçu dans ta boîte.',
      courrielVide: 'Entre ton adresse courriel.',
      courrielForme: 'Ton adresse courriel doit contenir un @, comme toi@exemple.bj.',
      envoi: 'Envoi en cours…',
      envoye: function (c) { return 'Code envoyé à ' + c + '. Regarde aussi tes indésirables.'; },
      attente: function (n) { return 'Nouveau code possible dans ' + n + ' s.'; },
      relance: 'Rien reçu ? Demande un nouveau code.',
      renvoye: 'Nouveau code envoyé. L’ancien reste valable.',
      issue: function (c, n) { return n + ' codes envoyés à ' + c + '. Essaie une autre adresse, ou reviens dans quelques minutes.'; },
      codeVide: 'Entre le code reçu dans ta boîte.',
      codeCourt: 'Le code compte six chiffres.',
      patiente: 'Un instant…',
      langue: 'Langue',
      toastNu: 'Le mode NU (communauté) arrive bientôt.'
    },
    en: {
      appel: 'Daily life made simple',
      mission: 'Complete your first task:',
      tache: 'Open my space',
      tCourriel: 'Your email address',
      tCode: 'The code in your inbox',
      alEnvoyer: 'Send the code',
      alRenvoyer: 'Send a new code',
      alConfirmer: 'Confirm the code',
      orienteCourriel: 'Start with your email address.',
      orienteCode: 'Enter the code in your inbox.',
      courrielVide: 'Enter your email address.',
      courrielForme: 'Your email address must contain an @, like you@example.bj.',
      envoi: 'Sending…',
      envoye: function (c) { return 'Code sent to ' + c + '. Check your spam folder too.'; },
      attente: function (n) { return 'A new code is possible in ' + n + ' s.'; },
      relance: 'Nothing yet? Ask for a new code.',
      renvoye: 'New code sent. The previous one still works.',
      issue: function (c, n) { return n + ' codes sent to ' + c + '. Try another address, or come back in a few minutes.'; },
      codeVide: 'Enter the code in your inbox.',
      codeCourt: 'The code is six digits.',
      patiente: 'One moment…',
      langue: 'Language',
      toastNu: 'NU, the community side of Roots, is coming soon.'
    }
  };

  /* Les symboles du tronc sont poses par le script de la page : un second
     script en ligne demanderait un second condensat a la politique. */
  Roots.sprite();

  function $(id) { return document.getElementById(id); }
  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }


  var chrome = Roots.initChrome({
    toastId: 'toast',
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    radio: true,
    onLangue: function () { basculerLangue(); }
  });
  Onboard.chrome();

  var courriel = null, envois = 0, reste = 0, minuterie = null;

  function appliquerLangue() {
    document.documentElement.lang = langue;
    /* Le chrome commun redessine ses propres libelles — sa bascule de langue
       comprise, qui vit au pied de son tiroir. Il attend que l'ecran le lui
       demande a chaque bascule ; sans cet appel, son lien reste sur la langue
       precedente. */
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-al]').forEach(function (el) {
      var c = el.getAttribute('data-al');
      var v = t()['al' + c.charAt(0).toUpperCase() + c.slice(1)];
      if (typeof v === 'string') el.setAttribute('aria-label', v);
    });
    if (reste > 0) dire('paroleCode', t().attente(reste), false);
    poserBascule();
  }

  /* La parole d'une sous-tache vit sous son champ et n'annonce que le geste
     suivant. Sa boite est reservee : y ecrire ne deplace rien. */
  function dire(id, texte, appelle) {
    var p = $(id);
    p.textContent = texte || '';
    p.classList.toggle('appelle', !!appelle);
    p.classList.toggle('se-voit', !!texte);
  }

  function ouvrir(li, foyer) { li.classList.remove('est-repliee'); if (foyer) foyer.focus(); }
  function occuper(b, oui) { b.setAttribute('aria-busy', oui ? 'true' : 'false'); }

  function courante() {
    var l = [$('st1'), $('st2')];
    for (var i = 0; i < l.length; i++) { if (!l[i].classList.contains('est-faite')) return l[i]; }
    return null;
  }

  /* Un geste incomplet ne se refuse pas : il ouvre le geste suivant et y pose
     le curseur. Aucune commande n'est desactivee. */
  $('mere').addEventListener('click', function () {
    var e = courante();
    if (!e) return;
    ouvrir(e, e.querySelector('input'));
    if (e.id === 'st1') dire('paroleCourriel', t().orienteCourriel, true);
    else dire('paroleCode', t().orienteCode, true);
  });

  function finAttente() {
    clearInterval(minuterie);
    reste = 0;
    $('btnCourriel').setAttribute('aria-label', t().alRenvoyer);
    dire('paroleCode', envois >= AVANT_ISSUE ? t().issue(courriel, envois) : t().relance, true);
  }

  function compter() {
    clearInterval(minuterie);
    reste = ATTENTE;
    dire('paroleCode', t().attente(reste), false);
    minuterie = setInterval(function () {
      reste--;
      if (reste <= 0) { finAttente(); return; }
      dire('paroleCode', t().attente(reste), false);
    }, 1000);
  }

  $('btnCourriel').addEventListener('click', function () {
    var c = $('courriel').value.trim();
    if (!c) { dire('paroleCourriel', t().courrielVide, true); $('courriel').focus(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) { dire('paroleCourriel', t().courrielForme, true); $('courriel').focus(); return; }
    if (reste > 0) { dire('paroleCode', t().attente(reste), true); $('code').focus(); return; }
    dire('paroleCourriel', t().envoi, false);
    occuper($('btnCourriel'), true);
    Roots.db.demanderCodeCourriel(c).then(function () {
      occuper($('btnCourriel'), false);
      envois++;
      courriel = c;
      dire('paroleCourriel', '', false);
      ouvrir($('st2'), $('code'));
      dire('paroleCode', envois === 1 ? t().envoye(c) : t().renvoye, false);
      setTimeout(compter, 2400);
    }, function (e) {
      occuper($('btnCourriel'), false);
      dire('paroleCourriel', e.message, true);
    });
  });

  $('btnCode').addEventListener('click', function () {
    var v = $('code').value.replace(/\D/g, '');
    if (!v) { dire('paroleCode', t().codeVide, true); $('code').focus(); return; }
    if (v.length !== 6) { dire('paroleCode', t().codeCourt, true); $('code').focus(); return; }
    dire('paroleCode', t().patiente, false);
    occuper($('btnCode'), true);
    Roots.db.ouvrirSessionParCode(courriel, v).then(function () {
      clearInterval(minuterie);
      location.replace(SUITE);
    }, function (e) {
      occuper($('btnCode'), false);
      dire('paroleCode', e.message, true);
    });
  });

  /* Une session deja ouverte n'a rien a faire ici. */
  if (Roots.db && Roots.db.estConnecte()) { location.replace(SUITE); return; }


  /* La bascule de langue nomme la langue vers laquelle elle mene, porte cette
     langue en attribut pour la synthese vocale, et son nom accessible porte le
     mot entier que deux lettres ne donnent pas. */
  function poserBascule() {
    var b = $('btnLangue');
    b.textContent = langue === 'fr' ? 'EN' : 'FR';
    b.setAttribute('lang', langue === 'fr' ? 'en' : 'fr');
    b.setAttribute('aria-label', t().langue);
  }

  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    if (Roots.retenirLangue) Roots.retenirLangue(langue);
    appliquerLangue();
  }

  $('btnLangue').addEventListener('click', basculerLangue);

  if (Roots.poserLibelles) Roots.poserLibelles();
  appliquerLangue();
})();
</script>
</body>
</html>
