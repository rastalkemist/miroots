<body class="p-space" data-surface="claire">

<script>Roots.sprite()</script>

<a class="saut-contenu" href="#contenu" data-t="saut">Aller au contenu</a>

<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil" data-al-chrome="accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU" data-al-chrome="mode"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="space.html">Space</a>
    </div>
    <div class="chrome-droite">
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-al-chrome="menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<div id="contenu" class="corps">

  <section class="coche-scene" aria-labelledby="titreCoche">
    <h1 id="titreCoche" data-t="titre">Ta première coche</h1>

    <input type="checkbox" id="premiereCoche">
    <label class="coche-tache" for="premiereCoche">
      <span class="coche-case" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="coche-mot" data-t="tache">Ouvrir mon espace</span>
    </label>

    <p class="coche-fait" data-t="fait">Strictement privé — personne ne voit ce que tu y poses.</p>

    <!-- La suite ne parait qu'une fois la case cochee : visibilite, foyer et
         geste suivent l'etat de la case par la relation de voisinage. Les
         etapes s'ouvrent une a une par le script ; une etape faite fige ses
         commandes et remplit sa pastille. -->
    <div class="coche-apres">
      <ol class="coche-liste" id="listeInscription">
        <li class="coche-etape" id="etapeCourriel" hidden>
          <span class="coche-pastille" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="coche-corps">
            <label class="coche-titre" for="courriel" data-t="tCourriel">Ton courriel</label>
            <div class="coche-champ">
              <input type="email" id="courriel" autocomplete="email" inputmode="email" spellcheck="false">
              <button type="button" class="bouton-contour" id="btnCourriel" data-t="bCourriel">Recevoir le code</button>
            </div>
            <p class="coche-note" id="noteCourriel" role="status"></p>
          </div>
        </li>
        <li class="coche-etape" id="etapeCode" hidden>
          <span class="coche-pastille" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="coche-corps">
            <label class="coche-titre" for="code" data-t="tCode">Le code reçu</label>
            <div class="coche-champ">
              <input type="text" id="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" spellcheck="false">
              <button type="button" class="bouton-contour" id="btnCode" data-t="bCode">Vérifier</button>
            </div>
            <p class="coche-note" id="noteCode" role="status"></p>
          </div>
        </li>
        <li class="coche-etape" id="etapeNotice" hidden>
          <span class="coche-pastille" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <div class="coche-corps">
            <span class="coche-titre" data-t="tNotice">Ton espace, à toi seul</span>
            <p class="coche-note" id="texteNotice"></p>
            <div class="coche-champ">
              <button type="button" class="bouton-contour" id="btnOuvrir" data-t="bOuvrir">Ouvrir mon plan</button>
            </div>
            <p class="coche-note" id="noteOuvrir" role="status"></p>
          </div>
        </li>
      </ol>
      <a class="entree-acte" id="acteFinal" href="space.html" data-t="acte" hidden>C'est parti</a>
    </div>
  </section>

</div>

<footer class="pied">
  <a href="confidentialite.html" data-t="piedPolitique">Politique de confidentialité</a>
</footer>

<nav class="chrome-bas" id="superNav">
  <button class="verbe actif" aria-current="true" data-verbe="space" aria-label="Plan"><span class="ico-rond"><svg class="i"><use href="#i-plan"/></svg></span></button>
  <button class="verbe" data-verbe="roots" aria-label="Roots"><span class="ico-rond"><svg class="i"><use href="#i-roots"/></svg></span></button>
  <button class="verbe" data-verbe="roam" aria-label="Roam"><span class="ico-rond"><svg class="i"><use href="#i-roam"/></svg></span></button>
</nav>
<div class="voile-menu" id="voileMenu"></div>
<div class="menu-pop" id="drawer">
  <div class="tete"><button class="fermer" id="fermerMenu" aria-label="Fermer" data-al-chrome="fermer"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="sections"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var T = {
    fr: {
      saut: 'Aller au contenu',
      titre: 'Ta première coche',
      tache: 'Ouvrir mon espace',
      fait: 'Strictement privé — personne ne voit ce que tu y poses.',
      acte: 'C’est parti',
      tCourriel: 'Ton courriel',
      bCourriel: 'Recevoir le code',
      courrielIncomplet: 'Un courriel complet, s’il te plaît.',
      codeParti: function (c) { return 'Le code est parti vers ' + c + '.'; },
      tCode: 'Le code reçu',
      bCode: 'Vérifier',
      codeCourt: 'Le code fait six chiffres.',
      tNotice: 'Ton espace, à toi seul',
      bOuvrir: 'Ouvrir mon plan',
      patiente: 'Un instant…',
      noticeMuette: 'La notice n’est pas arrivée. Recharge la page.',
      bRecharger: 'Recharger',
      piedPolitique: 'Politique de confidentialité',
      toastNu: 'Le mode NU (communauté) arrive bientôt.'
    },
    en: {
      saut: 'Skip to content',
      titre: 'Your first tick',
      tache: 'Open my space',
      fait: 'Strictly private — no one sees what you put here.',
      acte: 'Let’s go',
      tCourriel: 'Your email',
      bCourriel: 'Send me the code',
      courrielIncomplet: 'A full email address, please.',
      codeParti: function (c) { return 'The code is on its way to ' + c + '.'; },
      tCode: 'The code you received',
      bCode: 'Verify',
      codeCourt: 'The code is six digits.',
      tNotice: 'Your space, yours alone',
      bOuvrir: 'Open my plan',
      patiente: 'One moment…',
      noticeMuette: 'The notice didn’t arrive. Reload the page.',
      bRecharger: 'Reload',
      piedPolitique: 'Privacy policy',
      toastNu: 'NU, the community side of Roots, is coming soon.'
    }
  };

  function $(id) { return document.getElementById(id); }
  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }

    function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    if (inscription && inscription.notice) {
      $('texteNotice').textContent = Roots.db.texteNotice(inscription.notice, langue);
    }
    if ($('btnOuvrir').dataset.geste === 'recharger') {
      $('btnOuvrir').textContent = t().bRecharger;
      direNote($('noteOuvrir'), t().noticeMuette);
    }
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
  }

  var chrome = Roots.initChrome({
    toastId: 'toast',
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    radio: true,
    onLangue: function () { basculerLangue(); }
  });
  /* Pas de crochet de verbe : le balisage marque le verbe d'univers courant
     (aria-current), donc l'appui remonte la page au lieu de mener a l'outil —
     l'ecran est en amont du compte. Retirer cet etat rendrait l'appui
     navigant. */

  /* La bascule de langue vit au tiroir : le tronc fabrique le lien quand
     l'ecran ne porte pas de bouton de chrome, et redessine son libelle avec
     les sections. */
  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    if (Roots.retenirLangue) Roots.retenirLangue(langue);
    appliquerLangue();
  }

  /* ---- L'inscription, en taches ----
     Chaque etape s'ouvre quand la precedente est faite ; une etape faite fige
     ses commandes. La passerelle porte les appels ; l'ecran ne compose aucune
     adresse et ne garde aucun secret. */
  var inscription = { courriel: null, notice: null };

  function etapeFaite(li) {
    li.classList.add('faite');
    li.querySelectorAll('input, button').forEach(function (x) { x.disabled = true; });
  }
  function ouvrirEtape(li, foyer) {
    li.hidden = false;
    if (foyer) foyer.focus();
  }
  function occuper(bouton, oui) {
    bouton.disabled = oui;
    bouton.setAttribute('aria-busy', oui ? 'true' : 'false');
  }
  function direNote(el, texte) { el.textContent = texte || ''; }

  function demarrerInscription() {
    if (Roots.db && Roots.db.estConnecte()) { montrerNotice(); return; }
    ouvrirEtape($('etapeCourriel'), $('courriel'));
  }

  function montrerNotice() {
    Roots.db.notice('plan').then(function (n) {
      inscription.notice = n || null;
      $('texteNotice').textContent = Roots.db.texteNotice(n, langue);
      /* La passerelle garde les notices en memoire des le premier
         chargement : une table vide le reste pour la page entiere. Un
         reessai sur place ne peut donc rien ramener, et le geste offert
         devient le seul qui aboutisse. */
      if (!n) {
        direNote($('noteOuvrir'), t().noticeMuette);
        var b = $('btnOuvrir');
        b.removeAttribute('data-t');
        b.dataset.geste = 'recharger';
        b.textContent = t().bRecharger;
      }
      ouvrirEtape($('etapeNotice'), $('btnOuvrir'));
    }, function (e) { direNote($('noteOuvrir'), e.message); ouvrirEtape($('etapeNotice'), $('btnOuvrir')); });
  }

  $('btnCourriel').addEventListener('click', function () {
    var c = $('courriel').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) { direNote($('noteCourriel'), t().courrielIncomplet); $('courriel').focus(); return; }
    direNote($('noteCourriel'), t().patiente);
    occuper($('btnCourriel'), true);
    Roots.db.demanderCodeCourriel(c).then(function () {
      inscription.courriel = c;
      direNote($('noteCourriel'), t().codeParti(c));
      etapeFaite($('etapeCourriel'));
      ouvrirEtape($('etapeCode'), $('code'));
    }, function (e) {
      occuper($('btnCourriel'), false);
      direNote($('noteCourriel'), e.message);
    });
  });

  $('btnCode').addEventListener('click', function () {
    var v = $('code').value.replace(/\D/g, '');
    if (v.length !== 6) { direNote($('noteCode'), t().codeCourt); $('code').focus(); return; }
    direNote($('noteCode'), t().patiente);
    occuper($('btnCode'), true);
    Roots.db.ouvrirSessionParCode(inscription.courriel, v).then(function () {
      direNote($('noteCode'), '');
      etapeFaite($('etapeCode'));
      montrerNotice();
    }, function (e) {
      occuper($('btnCode'), false);
      direNote($('noteCode'), e.message);
    });
  });

  $('btnOuvrir').addEventListener('click', function () {
    if ($('btnOuvrir').dataset.geste === 'recharger') { location.reload(); return; }
    if (!inscription.notice) { montrerNotice(); return; }
    direNote($('noteOuvrir'), t().patiente);
    occuper($('btnOuvrir'), true);
    Roots.db.appeler('ouvrir_mon_acces_plan', { p_version: inscription.notice.version }).then(function () {
      direNote($('noteOuvrir'), '');
      etapeFaite($('etapeNotice'));
      var a = $('acteFinal');
      a.hidden = false;
      a.focus();
    }, function (e) {
      occuper($('btnOuvrir'), false);
      direNote($('noteOuvrir'), e.message);
    });
  });

  var lanceur = document.getElementById('premiereCoche');
  lanceur.addEventListener('change', function () {
    if (lanceur.checked && $('etapeCourriel').hidden && $('etapeNotice').hidden) demarrerInscription();
  });

  if (Roots.poserLibelles) Roots.poserLibelles();
  appliquerLangue();
})();
</script>
</body>
</html>
