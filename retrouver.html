<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; script-src 'self' 'sha256-zq8VBJJwdYBKfEemUSbHzbOJ8W43mw9ygKAfrEr3tzU=' 'sha256-50Lwb9Ntou46pR19y4L38PtRLD9KX8pOc76zvCinJ70='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://xrqorebcgnixcbqqeoll.supabase.co; manifest-src 'self'">
<title>Retrouver ma réservation — Roots</title>
<meta name="theme-color" content="#005B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.ico" sizes="any">
<link rel="icon" href="icones/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="stylesheet" href="roots-fonts.css">
<link rel="stylesheet" href="vendor/intlTelInput.min.css">
<link rel="stylesheet" href="roots-tokens.css">
<link rel="stylesheet" href="roots.css">
<script src="roots-db.js"></script>
<script src="roots.js"></script>

</head>
<body class="p-retrouver" data-surface="claire">

<script>Roots.sprite()</script>

<a class="saut-contenu" href="#contenu" data-t="saut">Aller au contenu</a>

<!-- ══════════════ CHROME HAUT ══════════════ -->
<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="index.html">Roots</a>
    </div>
    <div class="chrome-droite">
      <button class="lang-btn" id="btnLangue" aria-label="Langue">EN</button>
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<div id="contenu" class="corps">
  <h1 data-t="titre">Retrouver ma réservation</h1>
  <p class="sous" data-t="sous">Ton code et le numéro utilisé pour réserver.</p>

  <section class="bloc" id="recherche">
    <div class="champ">
      <span class="etiquette" data-t="lCode">Code de réservation</span>
      <input type="text" id="code" maxlength="6" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ABC123" aria-describedby="codeFormat">
      <span class="aide-champ" id="codeFormat" data-t="fCode">Six signes, lettres et chiffres — par exemple ABC123.</span>
    </div>
    <div class="champ">
      <span class="etiquette" data-t="lTel">Numéro utilisé</span>
      <input type="tel" inputmode="tel" id="tel" autocomplete="tel">
    </div>
    <button class="principal" id="btnChercher" data-t="bChercher">Retrouver</button>
    <p class="erreur cache" id="erreur" role="alert" aria-live="polite"></p>
  </section>

  <section class="bloc resu cache" id="resultat">
    <p class="quoi" id="rQuoi"></p>
    <p class="jour" id="rJour"></p>
    <div id="rLignes"></div>
    <div class="archive cache" id="rArchive" data-t="archive">Cette réservation est passée : tu peux la consulter, plus la modifier.</div>
    <button class="secondaire danger cache" id="btnAnnuler"></button>
    <p class="erreur cache" id="erreur2" role="alert" aria-live="polite"></p>
    <div class="issue-annul cache" id="issueAnnul" role="status" aria-live="polite">
      <p class="issue-titre" id="issueTitre"></p>
      <p class="issue-dit" id="issueDit"></p>
    </div>
    <button class="secondaire cache" id="btnAccueil" data-t="bAccueil">Retour à l’accueil</button>
    <button class="secondaire" id="btnAutre" data-t="bAutre">Chercher une autre réservation</button>
  </section>
</div>

<footer class="pied">
  <a href="confidentialite.html" data-t="mentions">Mentions légales</a>
</footer>

<!-- ══════════════ Super-nav + menu déroulant + toast ══════════════ -->
<nav class="chrome-bas" id="superNav">
  <button class="verbe dormant" aria-disabled="true" data-verbe="plan" aria-label="Plan"><span class="ico-rond"><svg class="i"><use href="#i-plan"/></svg></span></button>
  <button class="verbe actif" aria-current="true" data-verbe="roots" aria-label="Roots"><span class="ico-rond"><svg class="i"><use href="#i-roots"/></svg></span></button>
  <button class="verbe dormant" aria-disabled="true" data-verbe="roam" aria-label="Roam"><span class="ico-rond"><svg class="i"><use href="#i-roam"/></svg></span></button>
</nav>
<div class="voile-menu" id="voileMenu"></div>
<div class="menu-pop" id="drawer">
  <div class="tete"><button class="fermer" id="fermerMenu" aria-label="Fermer"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="sections"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function () {
  'use strict';

  var T = {
    fr: {
      titre: 'Retrouver ma réservation', sous: 'Ton code et le numéro utilisé pour réserver.',
      lCode: 'Code de réservation', lTel: 'Numéro utilisé', bChercher: 'Retrouver',
      bAutre: 'Chercher une autre réservation',
      archive: 'Cette réservation est passée : tu peux la consulter, plus la modifier.',
      manque: 'Entre le code à 6 caractères et ton numéro.',
      introuvable: 'Aucune réservation avec ce code et ce numéro.',
      onCherche: 'On cherche…',
      annuler: 'Annuler cette réservation', confirmer: 'Confirmer l’annulation',
      annulee: 'Réservation annulée.',
      issues: {
        annulee: { titre: 'Réservation annulée', dit: 'C’est fait. Si un montant a été réglé, le remboursement suit le barème annoncé et l’équipe te recontacte.' },
        demande_transmise: { titre: 'Demande d’annulation transmise', dit: 'À moins de sept jours, une annulation se décide avec l’équipe : ta réservation est encore active et ta demande lui est transmise. Elle te répond.' }
      },
      bAccueil: 'Retour à l’accueil',
      matin: 'Matinée', apres_midi: 'Après-m', journee: 'Journée',
      lEspace: 'Espace', lLogement: 'Logement', lCreneau: 'Créneau', lPersonnes: 'Personnes',
      lMontant: 'Montant', lEtat: 'État', lAcompte: 'Acompte', lArrivee: 'Arrivée', lDepart: 'Départ',
      lCodeLigne: 'Code', monnaie: 'FCFA',
      etats: { retenue: 'Place gardée', confirmee: 'Confirmée', arrivee: 'Arrivé', terminee: 'Terminée',
               annulee: 'Annulée', expiree: 'Expirée', no_show: 'Non honorée', preemptee: 'Déplacée' },
      paie: { en_attente: 'À payer', acompte_paye: 'Acompte payé', paye: 'Payé',
              rembourse: 'Remboursé', rembourse_partiellement: 'Remboursé en partie', echoue: 'Paiement échoué' },
      toastVerbe: function (v) { return v + ' arrive bientôt.'; },
      toastNu: 'Le mode NU (communauté) arrive bientôt.',
      mentions: 'Mentions légales',
      saut: 'Aller au contenu',
      phase: 'Version d\'essai. Des fonctions sont incomplètes ou indisponibles.',
      fCode: 'Six signes, lettres et chiffres — par exemple ABC123.',
      fCode: 'Six signes, lettres et chiffres — par exemple ABC123.'
    },
    en: {
      titre: 'Find my booking', sous: 'Your code and the number you booked with.',
      lCode: 'Booking code', lTel: 'Phone number used', bChercher: 'Find',
      bAutre: 'Find another booking',
      archive: 'This booking is past: you can view it, not change it.',
      manque: 'Enter the 6-character code and your number.',
      introuvable: 'No booking matches this code and number.',
      onCherche: 'Searching…',
      annuler: 'Cancel this booking', confirmer: 'Confirm cancellation',
      annulee: 'Booking cancelled.',
      issues: {
        annulee: { titre: 'Booking cancelled', dit: 'Done. If an amount was paid, the refund follows the published terms and the team will get back to you.' },
        demande_transmise: { titre: 'Cancellation request sent', dit: 'Within seven days, a cancellation is decided with the team: your booking is still active and your request has been sent. They will reply.' }
      },
      bAccueil: 'Back to home',
      matin: 'Morning', apres_midi: 'Afternoon', journee: 'Full day',
      lEspace: 'Space', lLogement: 'Room', lCreneau: 'Slot', lPersonnes: 'People',
      lMontant: 'Amount', lEtat: 'Status', lAcompte: 'Deposit', lArrivee: 'Check-in', lDepart: 'Check-out',
      lCodeLigne: 'Code', monnaie: 'FCFA',
      etats: { retenue: 'Held', confirmee: 'Confirmed', arrivee: 'Checked in', terminee: 'Completed',
               annulee: 'Cancelled', expiree: 'Expired', no_show: 'No-show', preemptee: 'Moved' },
      paie: { en_attente: 'To pay', acompte_paye: 'Deposit paid', paye: 'Paid',
              rembourse: 'Refunded', rembourse_partiellement: 'Partly refunded', echoue: 'Payment failed' },
      toastVerbe: function (v) { return v + ' coming soon.'; },
      toastNu: 'NU mode (community) coming soon.',
      mentions: 'Legal notices',
      saut: 'Skip to content',
      phase: 'Trial version. Some features are incomplete or unavailable.',
      fCode: 'Six characters, letters and digits — for example ABC123.',
      fCode: 'Six characters, letters and digits — for example ABC123.'
    }
  };

  var VERBES = { plan: 'Plan', roots: 'Roots', roam: 'Roam' };

  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  var trouvee = null;
  var arme = false;
  var iti = null;
  var $ = function (i) { return document.getElementById(i); };
  function t() { return T[langue]; }
  function fmt(n) { return Number(n || 0).toLocaleString(langue === 'fr' ? 'fr-FR' : 'en-US'); }
  function prix(n) { return fmt(n) + ' ' + t().monnaie; }

  /* ---------- Chrome ---------- */

  var chromeUI = Roots.initChrome({
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    toastVerbe: function (l, libelle) { return T[l].toastVerbe(libelle); },
    verbes: VERBES
  });

  /* ---------- Langue ---------- */

  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.title = t().titre + ' — Roots';
    $('btnLangue').textContent = langue === 'fr' ? 'EN' : 'FR';
    chromeUI.dessinerSections();
    if (trouvee) afficher(trouvee);
    if (issueCourante) montrerIssue(issueCourante);
  }

  /* ---------- Messages inline ---------- */

  function erreur(id, msg) { var e = $(id); e.textContent = msg; e.classList.remove('cache'); }
  function cacher(id) { $(id).classList.add('cache'); }

  /* ---------- Numéro ---------- */

  function numeroSaisi() {
    if (iti && typeof iti.getNumber === 'function') {
      var v = iti.getNumber();
      if (v) return v;
    }
    return ($('tel').value || '').trim();
  }

  /* ---------- Résultat ---------- */

  function jourLisible(iso) {
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString(langue === 'en' ? 'en-GB' : 'fr-FR',
      { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function info(libelle, valeur, chiffre) {
    var d = document.createElement('div');
    d.className = 'ligne-info';
    d.innerHTML = '<span class="l"></span><span class="v' + (chiffre ? ' chiffre' : '') + '"></span>';
    d.querySelector('.l').textContent = libelle;
    if (valeur instanceof Node) d.querySelector('.v').appendChild(valeur);
    else d.querySelector('.v').textContent = valeur;
    return d;
  }

  function pastilleEtat(statut) {
    var s = document.createElement('span');
    s.className = 'etat ' + statut;
    s.textContent = (t().etats[statut] || statut);
    return s;
  }

  function afficher(paquet) {
    trouvee = paquet;
    var r = paquet.r;
    var z = $('rLignes'); z.innerHTML = '';

    if (paquet.type === 'espace') {
      $('rQuoi').textContent = r.espace + ' · ' + (t()[r.creneau] || r.creneau);
      $('rJour').textContent = jourLisible(r.date_jour);
      z.appendChild(info(t().lPersonnes, String(r.nb_personnes), true));
      z.appendChild(info(t().lMontant, prix(r.montant_total), true));
    } else {
      $('rQuoi').textContent = r.logement;
      $('rJour').textContent = jourLisible(r.arrivee) + ' → ' + jourLisible(r.depart);
      z.appendChild(info(t().lMontant, prix(r.montant_total), true));
      if (r.montant_acompte) z.appendChild(info(t().lAcompte, prix(r.montant_acompte), true));
    }
    z.appendChild(info(t().lEtat, pastilleEtat(r.statut)));
    if (r.statut_paiement) z.appendChild(info('', t().paie[r.statut_paiement] || r.statut_paiement));

    var code = document.createElement('div');
    code.className = 'leCode';
    code.textContent = r.code;
    z.appendChild(info(t().lCodeLigne, code));

    /* La base dit elle-même si la réservation est encore modifiable :
       l'écran obéit au lieu de recalculer la règle. */
    var figee = r.lecture_seule || ['annulee', 'expiree', 'terminee', 'no_show'].indexOf(r.statut) !== -1;
    $('rArchive').classList.toggle('cache', !r.lecture_seule);
    var b = $('btnAnnuler');
    b.classList.toggle('cache', figee);
    arme = false;
    b.classList.remove('arme');
    b.textContent = t().annuler;

    $('recherche').classList.add('cache');
    $('resultat').classList.remove('cache');
    window.scrollTo(0, 0);
  }

  /* Le code voyage dans le lien de confirmation : s'il est la, le champ est
     deja rempli et le premier geste du visiteur est son numero, pas la
     recopie de six caracteres lus sur un autre ecran. Le code est mis en
     capitales a la saisie : il est emis en capitales, et une minuscule tapee
     au telephone ne doit pas ressembler a une erreur de code. */
  (function () {
    var duLien = (new URLSearchParams(location.search).get('code') || '')
      .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    if (duLien) { $('code').value = duLien; }
    $('code').addEventListener('input', function () {
      var h = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      if (h !== this.value) this.value = h;
    });
    var premier = duLien ? 'tel' : 'code';
    var cible = document.getElementById(premier);
    if (cible && !('ontouchstart' in window)) cible.focus();
  })();

  async function chercher() {
    cacher('erreur');
    oublierIssue();
    var code = $('code').value.trim().toUpperCase();
    var tel = numeroSaisi();
    if (code.length !== 6 || tel.replace(/\D/g, '').length < 8) {
      erreur('erreur', t().manque);
      /* Le message dit quoi faire ; le focus emmene a l'endroit ou le faire. */
      Roots.focusPremierFautif(code.length !== 6 ? ['code', 'tel'] : ['tel', 'code']);
      return;
    }

    var b = $('btnChercher');
    b.disabled = true;
    b.textContent = t().onCherche;
    try {
      var p = await Roots.db.retrouver(code, tel);
      if (!p) erreur('erreur', t().introuvable);
      else afficher(p);
    } catch (e) {
      erreur('erreur', e.message);
    } finally {
      b.disabled = false;
      b.textContent = t().bChercher;
    }
  }

  /* Annulation en deux temps : un geste conséquent ne part jamais au premier appui. */
  async function annuler() {
    cacher('erreur2');
    var b = $('btnAnnuler');
    if (!arme) {
      arme = true;
      b.classList.add('arme');
      b.textContent = t().confirmer;
      return;
    }
    var code = $('code').value.trim().toUpperCase();
    var tel = numeroSaisi();
    b.disabled = true;
    try {
      /* Le socle rend DEUX issues : la reservation est annulee, ou la demande
         est transmise a l'equipe. Les confondre dirait au visiteur que sa
         reservation est annulee alors qu'elle est encore active, et de
         l'argent en depend. On lit ce que la porte rend. */
      var rendu = (trouvee.type === 'espace')
        ? await Roots.db.annulerReservationEspace(code, tel)
        : await Roots.db.annulerReservationLogement(code, tel);
      var p = await Roots.db.retrouver(code, tel);
      if (p) afficher(p);
      montrerIssue(rendu && rendu.resultat);
    } catch (e) {
      erreur('erreur2', e.message);
      arme = false;
      b.classList.remove('arme');
      b.textContent = t().annuler;
    } finally {
      b.disabled = false;
    }
  }

  /* L'ecran final de l'annulation. Une issue que la table ne connait pas ne
     s'invente pas : on ne dit alors rien plutot que d'affirmer a faux. */
  var issueCourante = null;

  function montrerIssue(resultat) {
    var mots = t().issues[resultat];
    issueCourante = mots ? resultat : null;
    $('issueAnnul').classList.toggle('cache', !mots);
    $('btnAccueil').classList.toggle('cache', !mots);
    if (!mots) {
      if (resultat) erreur('erreur2', t().introuvable);
      return;
    }
    $('issueTitre').textContent = mots.titre;
    $('issueDit').textContent = mots.dit;
    /* La demande transmise laisse la reservation ACTIVE : le bouton
       d'annulation reviendrait de lui-meme au reaffichage, et un second appui
       rejouerait la demande. On le ferme. */
    $('btnAnnuler').classList.add('cache');
  }

  function oublierIssue() {
    issueCourante = null;
    $('issueAnnul').classList.add('cache');
    $('btnAccueil').classList.add('cache');
  }

  /* ---------- Câblage des gestes ---------- */

  $('code').addEventListener('input', function () { this.value = this.value.toUpperCase(); });
  $('btnChercher').addEventListener('click', chercher);
  $('btnAnnuler').addEventListener('click', annuler);
  $('btnAccueil').addEventListener('click', function () { location.href = 'index.html'; });
  $('btnAutre').addEventListener('click', function () {
    trouvee = null;
    oublierIssue();
    $('resultat').classList.add('cache');
    $('recherche').classList.remove('cache');
    cacher('erreur'); cacher('erreur2');
  });
  $('btnLangue').addEventListener('click', function () {
    langue = langue === 'fr' ? 'en' : 'fr';
    Roots.retenirLangue(langue);
    appliquerLangue();
  });

  appliquerLangue();

  /* Un lien profond permet d'arriver déjà rempli depuis un message. */
  var q = new URLSearchParams(location.search);
  if (q.get('code')) $('code').value = q.get('code').toUpperCase().slice(0, 6);

  window.addEventListener('load', function () {
    iti = Roots.initTelRoots($('tel'));
    var tel = q.get('tel');
    if (!tel) return;
    if (iti && typeof iti.setNumber === 'function') iti.setNumber(tel);
    else $('tel').value = tel;
  });
})();
</script>
</body>
</html>
