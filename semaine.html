<!DOCTYPE html>

<meta property="og:description" content="L’espace de travail des membres du Roots : la semaine, les engagements, ce qui avance.">

</head>
<body class="p-space" data-surface="claire">

<script>Roots.sprite()</script>

<a class="saut-contenu" href="#contenu" data-t="saut">Aller au contenu</a>

<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil" data-al-chrome="accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU" data-al-chrome="mode"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="space.html">Space</a>
    </div>
    <div class="chrome-droite">
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-al-chrome="menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<div id="contenu" class="corps">

  <p class="cadre-semaine" id="sousTitre"></p>

  <section class="bloc-plan" aria-labelledby="etSemaine">
    <span class="etiquette" id="etSemaine" data-t="etSemaine">Ma semaine</span>
    <p class="etat-semaine" id="etatSemaine" role="status" hidden></p>
<button type="button" class="bouton-contour" id="btnRecharger" hidden>Réessayer</button>
<div id="listeSemaine"></div>
    <p class="vide" id="videSemaine" data-t="vide" hidden>Rien de posé pour l'instant. Écris un engagement là-haut — un seul suffit pour commencer.</p>
  </section>

  <section class="bloc-plan" id="blocOu" aria-labelledby="etOu">
    <span class="etiquette" id="etOu" data-t="etOu">Où j'en suis</span>
    <p class="compte" id="compte"></p>
    <div class="jauge" id="jauge" role="progressbar" aria-labelledby="etOu" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="part" id="jaugePart" style="width:0%"></div>
    </div>
    <span class="compte-dit" id="compteDit"></span>
  </section>

</div>

<div class="ecrire-bas" id="ecrireBas">
  <div class="jours" id="jours" role="group" aria-labelledby="etQuand"></div>
  <span class="visuellement-cache" id="etQuand" data-t="etQuand">Quand ? (facultatif)</span>
  <div class="ecrire">
    <label class="visuellement-cache" for="engagement" data-t="labEngagement">Qu'est-ce que tu veux faire ?</label>
    <textarea id="engagement" rows="1" maxlength="120" enterkeyhint="send" data-p="phEngagement" placeholder="Finir la maquette du flyer…"></textarea>
    <button type="button" class="envoi" id="btnAjouter" aria-label="Ajouter" data-al="ajouter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<footer class="pied">
  <a href="confidentialite.html" data-t="piedPolitique">Politique de confidentialité</a>
</footer>

<nav class="chrome-bas" id="superNav">
  <button class="verbe actif" aria-current="true" data-verbe="space" aria-label="Plan"><span class="ico-rond"><svg class="i"><use href="#i-plan"/></svg></span></button>
  <button class="verbe" data-verbe="roots" aria-label="Roots"><span class="ico-rond"><svg class="i"><use href="#i-roots"/></svg></span></button>
  <button class="verbe" data-verbe="roam" aria-label="Roam"><span class="ico-rond"><svg class="i"><use href="#i-roam"/></svg></span></button>
</nav>
<div class="voile-menu" id="voileMenu"></div>
<div class="menu-pop" id="drawer">
  <div class="tete"><button class="fermer" id="fermerMenu" aria-label="Fermer" data-al-chrome="fermer"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="sections"></div>
</div>
<template id="tplCoche"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* L'ecran exige une session : sans elle, la couverture est la porte. La
     garde vit aussi sur l'evenement — une session qui tombe en cours de
     route renvoie a la couverture au lieu de laisser des appels refuses. */
  if (!window.Roots || !Roots.db || !Roots.db.estConnecte()) {
    location.replace('onboard.html');
    return;
  }
  window.addEventListener('roots:session', function (e) {
    if (!e.detail.connecte) location.replace('onboard.html');
  });

  /* La source des taches est le socle, par la passerelle : l'ecran garde une
     copie de la semaine servie et la redessine apres chaque ecriture. Chaque
     porte refuse sans session ; la garde en tete d'ecran s'en charge avant.
     Ce que l'ecran exige de la reponse : taches[] portant id, engagement,
     jour, fait_le, ordre — les noms que le socle rend. */
  var SEMAINE = { taches: [] };

  function chargerSemaine() {
    return Roots.db.appeler('plan_ma_semaine').then(function (r) {
      SEMAINE.taches = (r && r.taches) || [];
    });
  }

  var PlanDonnees = {
    taches: function () { return SEMAINE.taches; }
  };

  var T = {
    fr: {
      saut: 'Aller au contenu',
      titre: 'Ma semaine',
      etPoser: 'Poser un engagement',
      labEngagement: 'Qu’est-ce que tu veux faire ?',
      phEngagement: 'Finir la maquette du flyer…',
      etQuand: 'Quand ? (facultatif)',
      ajouter: 'Ajouter',
      etSemaine: 'Ma semaine',
      etOu: 'Où j’en suis',
      vide: 'Rien de posé pour l’instant. Écris un engagement là-haut — un seul suffit pour commencer.',
      semaineMuette: 'La semaine n’a pas répondu.',
      faites: function (n) { return 'Faites (' + n + ')'; },
      reessayer: 'Réessayer',
      piedPolitique: 'Politique de confidentialité',
      toastNu: 'Le mode NU (communauté) arrive bientôt.',
      jours: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
      joursLongs: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'],
      sansJour: 'Cette semaine',
      mois: ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'],
      cadre: function (a, b) { return 'Du ' + a + ' au ' + b + '. Ce que tu poses ici ne regarde que toi.'; },
      compte: function (f, n) { return f + ' sur ' + n; },
      dit0: 'Rien de tenu pour l’instant, et la semaine n’est pas finie.',
      dit1: 'Un engagement tenu.',
      ditN: function (f) { return f + ' engagements tenus.'; },
      ditTout: 'Tout est tenu.',
      aria: function (e, f) { return (f ? 'Tenu : ' : 'Pas encore tenu : ') + e; }
    },
    en: {
      saut: 'Skip to content',
      titre: 'My week',
      etPoser: 'Set a commitment',
      labEngagement: 'What do you want to do?',
      phEngagement: 'Finish the flyer layout…',
      etQuand: 'When? (optional)',
      ajouter: 'Add',
      etSemaine: 'My week',
      etOu: 'Where I stand',
      vide: 'Nothing set yet. Write one commitment above — one is enough to start.',
      semaineMuette: 'The week didn’t answer.',
      faites: function (n) { return 'Done (' + n + ')'; },
      reessayer: 'Try again',
      piedPolitique: 'Privacy policy',
      toastNu: 'NU, the community side of Roots, is coming soon.',
      jours: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
      joursLongs: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
      sansJour: 'This week',
      mois: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      cadre: function (a, b) { return a + ' to ' + b + '. What you set here is yours alone.'; },
      compte: function (f, n) { return f + ' of ' + n; },
      dit0: 'Nothing kept yet, and the week is not over.',
      dit1: 'One commitment kept.',
      ditN: function (f) { return f + ' commitments kept.'; },
      ditTout: 'All kept.',
      aria: function (e, f) { return (f ? 'Kept: ' : 'Not kept yet: ') + e; }
    }
  };

  function $(id) { return document.getElementById(id); }
  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }

  var jourChoisi = null;

  /* Le lundi de la semaine en cours. getDay() rend 0 pour dimanche : le
     decalage ramene la semaine sur un debut lundi. */
  function lundi() {
    var d = new Date();
    var n = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - n);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function jourDe(i) {
    var d = lundi();
    d.setDate(d.getDate() + i);
    return d;
  }

  function bref(d) { return d.getDate() + ' ' + t().mois[d.getMonth()]; }

  /* Le choix par defaut ouvre la rangee : il reste visible sans defiler,
     les jours suivent dans l'ordre de la semaine. */
  function dessinerJours() {
    var z = $('jours');
    z.textContent = '';
    var s = document.createElement('button');
    s.type = 'button';
    s.className = 'jour';
    s.dataset.jour = '';
    s.setAttribute('aria-pressed', jourChoisi === null ? 'true' : 'false');
    s.textContent = t().sansJour;
    z.appendChild(s);
    for (var i = 0; i < 7; i++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'jour';
      b.dataset.jour = String(i);
      b.setAttribute('aria-pressed', jourChoisi === i ? 'true' : 'false');
      b.textContent = t().jours[i];
      z.appendChild(b);
    }
  }

  /* La coche vient d'un gabarit du balisage : construite en script, elle
     exigerait de nommer un espace de noms, et une adresse ecrite dans un
     script se lit comme un appel sortant. */
  function coche() {
    return $('tplCoche').content.firstElementChild.cloneNode(true);
  }

  function ligne(tache) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tache';
    b.dataset.id = tache.id;
    var fait = !!tache.fait_le;
    b.setAttribute('aria-pressed', fait ? 'true' : 'false');
    b.setAttribute('aria-label', t().aria(tache.engagement, fait));
    var c = document.createElement('span');
    c.className = 'case';
    c.appendChild(coche());
    var e = document.createElement('span');
    e.className = 'engagement';
    e.textContent = tache.engagement;
    b.appendChild(c);
    b.appendChild(e);
    return b;
  }

  var DEPLIES = [];

  function listeDe(items) {
    var ul = document.createElement('ul');
    ul.className = 'taches';
    items.forEach(function (x) {
      var li = document.createElement('li');
      li.appendChild(ligne(x));
      ul.appendChild(li);
    });
    return ul;
  }

  /* Un groupe vide ne se rend pas : une case vide n'informe de rien, et le
     non-fait ne se met pas en scene. */
  function dessinerSemaine() {
    var taches = PlanDonnees.taches();
    var z = $('listeSemaine');
    z.textContent = '';
    $('videSemaine').hidden = taches.length > 0;

    var groupes = [];
    for (var i = 0; i < 7; i++) groupes.push({ cle: i, titre: t().joursLongs[i] + ' ' + bref(jourDe(i)), items: [] });
    groupes.push({ cle: null, titre: t().sansJour, items: [] });

    taches.forEach(function (x) {
      var g = groupes[x.jour === null || x.jour === undefined ? 7 : x.jour];
      if (g) g.items.push(x);
    });

    groupes.forEach(function (g) {
      if (!g.items.length) return;
      var bloc = document.createElement('div');
      bloc.className = 'groupe-jour';
      var et = document.createElement('span');
      et.className = 'etiquette';
      et.textContent = g.titre;
      g.items.sort(function (a, b) { return a.ordre - b.ordre; });
      var restantes = g.items.filter(function (x) { return !x.fait_le; });
      var faites = g.items.filter(function (x) { return !!x.fait_le; });
      bloc.appendChild(et);
      /* Les faites coulent sous les restantes et se tiennent repliees avec
         leur compte : la liste ne montre que ce qui reste a faire. Une liste
         vide ne se rend pas — une surface sans ligne n'informe de rien. */
      if (restantes.length) bloc.appendChild(listeDe(restantes));
      if (faites.length) {
        var ouvert = DEPLIES.indexOf(g.cle === null ? 'x' : String(g.cle)) !== -1;
        var r = document.createElement('button');
        r.type = 'button';
        r.className = 'repli-faites';
        r.dataset.groupe = g.cle === null ? 'x' : String(g.cle);
        r.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
        r.textContent = t().faites(faites.length);
        bloc.appendChild(r);
        var lf = listeDe(faites);
        lf.hidden = !ouvert;
        bloc.appendChild(lf);
      }
      z.appendChild(bloc);
    });
  }

  /* Une section qui ne dit rien encombre : la progression ne se rend qu'a
     partir du premier engagement pose. */
  function dessinerProgression() {
    var taches = PlanDonnees.taches();
    var n = taches.length;
    $('blocOu').hidden = n === 0;
    if (n === 0) return;
    var f = taches.filter(function (x) { return !!x.fait_le; }).length;
    $('compte').textContent = t().compte(f, n);
    var j = $('jauge');
    j.setAttribute('aria-valuemax', String(n));
    j.setAttribute('aria-valuenow', String(f));
    $('jaugePart').style.width = (n ? Math.round(f * 100 / n) : 0) + '%';
    var dit = f === 0 ? t().dit0 : (f === n ? t().ditTout : (f === 1 ? t().dit1 : t().ditN(f)));
    $('compteDit').textContent = dit;
  }

  function appliquerLangue() {
    document.documentElement.lang = langue;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-p]').forEach(function (el) {
      var v = t()[el.getAttribute('data-p')];
      if (typeof v === 'string') el.placeholder = v;
    });
    $('sousTitre').textContent = t().cadre(bref(jourDe(0)), bref(jourDe(6)));
    dessinerJours();
    dessinerSemaine();
    dessinerProgression();
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
  }

  var chrome = Roots.initChrome({
    toastId: 'toast',
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    radio: true,
    onLangue: function () { basculerLangue(); }
  });

  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    if (Roots.retenirLangue) Roots.retenirLangue(langue);
    appliquerLangue();
  }

  $('jours').addEventListener('click', function (e) {
    var b = e.target.closest('.jour');
    if (!b) return;
    var v = b.dataset.jour;
    jourChoisi = v === '' ? null : parseInt(v, 10);
    dessinerJours();
  });

  /* La coche part a la porte, l'ecran suit la reponse : un refus laisse la
     ligne dans son etat vrai au lieu d'afficher un fait que la base n'a pas. */
  $('listeSemaine').addEventListener('click', function (e) {
    var r = e.target.closest('.repli-faites');
    if (r) {
      var cle = r.dataset.groupe;
      var i = DEPLIES.indexOf(cle);
      if (i === -1) DEPLIES.push(cle); else DEPLIES.splice(i, 1);
      dessinerSemaine();
      return;
    }
    var b = e.target.closest('.tache');
    if (!b || b.disabled) return;
    var fait = b.getAttribute('aria-pressed') !== 'true';
    b.disabled = true;
    Roots.db.appeler('plan_basculer_tache', { p_tache: b.dataset.id, p_fait: fait })
      .then(chargerSemaine)
      .then(function () { dessinerSemaine(); dessinerProgression(); },
            function (er) { b.disabled = false; chrome.toast(er.message); });
  });

  /* Le bouton refuse un engagement vide plutot que d'en poser un sans texte :
     une ligne sans mot ne se relit pas. */
  /* Arrive avec l'ancre du champ, l'ecran pose le foyer dessus : le geste
     d'ajout rapide du hall se termine ici, clavier ouvert. */
  if (location.hash === '#engagement') {
    requestAnimationFrame(function () {
      var ch = $('engagement');
      if (ch) { ch.focus(); ch.scrollIntoView({ block: 'center' }); }
    });
  }

  /* Un engagement est une ligne : l'entree l'envoie, le texte se replie sur
     une seule suite de mots. La pastille ne s'allume que sur du contenu —
     les espaces seuls ne comptent pas. */
  function marquerChampSemaine() {
    var champ = $('engagement');
    champ.closest('.ecrire').classList.toggle('a-du-texte', champ.value.trim().length > 0);
  }

  $('engagement').addEventListener('input', marquerChampSemaine);
  $('engagement').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('btnAjouter').click();
    }
  });

  $('btnAjouter').addEventListener('click', function () {
    var champ = $('engagement');
    var texte = champ.value.replace(/\s+/g, ' ').trim();
    if (!texte) { champ.focus(); return; }
    var b = $('btnAjouter');
    b.disabled = true;
    Roots.db.appeler('plan_poser_tache', { p_engagement: texte, p_jour: jourChoisi })
      .then(chargerSemaine)
      .then(function () {
        b.disabled = false;
        champ.value = '';
        marquerChampSemaine();
        dessinerSemaine();
        dessinerProgression();
        champ.focus();
      }, function (er) { b.disabled = false; chrome.toast(er.message); });
  });


  /* Le premier chargement : un acces jamais ouvert renvoie a la couverture,
     qui sait l'ouvrir ; les autres refus se disent sur place, avec le geste
     pour reessayer. */
  function accueillirSemaine() {
    $('etatSemaine').hidden = true;
    $('btnRecharger').hidden = true;
    chargerSemaine().then(function () {
      dessinerSemaine();
      dessinerProgression();
    }, function (er) {
      if (er && (er.code === 403 || /acces a Plan non ouvert/.test(er.brut || ''))) {
        location.replace('onboard.html');
        return;
      }
      $('etatSemaine').textContent = t().semaineMuette + (er && er.message ? ' ' + er.message : '');
      $('etatSemaine').hidden = false;
      $('btnRecharger').textContent = t().reessayer;
      $('btnRecharger').hidden = false;
    });
  }
  $('btnRecharger').addEventListener('click', accueillirSemaine);

  if (Roots.poserLibelles) Roots.poserLibelles();
  appliquerLangue();
  accueillirSemaine();
})();
</script>
</body>
</html>
