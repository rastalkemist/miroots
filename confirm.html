<!DOCTYPE html>
<html lang="fr">
<head>
<!-- emprunt-tronc: p-space corps lang-btn saut-contenu chrome-haut chrome-inner
     chrome-bas chrome-titre chrome-burger chrome-droite ankh-home centre toggle
     mot reste sub switch knob nu i ico-rond verbe menu-pop voile-menu tete
     fermer toast actif garde-banniere — la barre, le tiroir et le bandeau sont
     des pieces d'infrastructure : ils gardent leurs noms et leurs regles, seule
     leur presentation change ici. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; script-src 'self' 'sha256-VLd7HNS5Wfc9HRApsERmc3mGzMZBZ3tUqKXtsozDoLc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://xrqorebcgnixcbqqeoll.supabase.co; manifest-src 'self'">
<title>Mi Space | Ton espace est prêt</title>
<meta name="description" content="l’app pour NU">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mi Roots">
<meta property="og:title" content="Mi Space | Ton espace est prêt">
<meta property="og:description" content="l’app pour NU">
<meta property="og:locale" content="fr_BJ">
<meta property="og:locale:alternate" content="en_GB">
<meta name="theme-color" content="#1A1A1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/favicon.ico" sizes="any">
<link rel="icon" href="icones/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="preload" href="fonts/MuseoModerno-var.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="roots-fonts.css">
<link rel="stylesheet" href="roots-tokens.css">
<link rel="stylesheet" href="roots.css">
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="onboard.css">
<script src="roots.js"></script>
<script src="roots-db.js"></script>
<script src="garde.js"></script>
<script src="onboard.js"></script>
</head>
<body class="p-space ouv-page ouv-confirm" data-surface="claire">



<a class="saut-contenu" href="#contenu" data-t="saut">Aller au contenu</a>

<header class="chrome-haut">
  <div class="chrome-inner">
    <a class="ankh-home" href="index.html" aria-label="Accueil" data-al-chrome="accueil"><svg viewBox="0 0 110 111" role="img" aria-hidden="true"><use href="#i-ankh"/></svg></a>
    <div class="centre">
      <div class="toggle" id="marque">
        <span class="mot" id="motMode">Mi</span>
        <span class="reste">
          <span class="sub">(solo)</span>
          <span class="switch" id="switchMode" aria-label="Basculer Mi / NU" data-al-chrome="mode"><span class="knob"></span></span>
          <span class="sub">(social)</span>
          <span class="nu">NU</span>
        </span>
      </div>
      <a class="chrome-titre" href="space.html">Space</a>
    </div>
    <div class="chrome-droite">
      <button class="chrome-burger" id="btnBurger" aria-expanded="false" aria-controls="drawer" aria-label="Menu" data-al-chrome="menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
  </div>
</header>

<button type="button" class="ouv-langue" id="btnLangue"></button>



<main class="ouv-piece">
  <div class="ouv-air ouv-avant"></div>
  <p class="ouv-appel" data-t="appel">Ton espace est prêt</p>
  <div class="ouv-air ouv-entre"></div>
  <div class="ouv-groupe">
    <h1 class="ouv-titre" data-t="titre">Comment doit-on t'appeler&nbsp;?</h1>
    <div class="ouv-air ouv-question"></div>
    <div class="ouv-demande">
      <label class="ouv-etiq" for="prenom" data-t="tPrenom">Prénom</label>
      <div class="ouv-rang">
        <input id="prenom" type="text" name="prenom" autocomplete="given-name"
               spellcheck="false" autocapitalize="words" enterkeyhint="go"
               required aria-describedby="aparteNom">
        <button type="button" class="ouv-go" id="btnPrenom" data-al="entrer"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </div>
      <div class="ouv-air ouv-note"></div>
      <p class="ouv-parole" id="paroleNom" role="status"></p>
      <p class="ouv-aparte" id="aparteNom" data-t="aparte">Le nom que tu liras en haut de ton espace. Tu pourras en changer quand tu veux.</p>
    </div>
  </div>
  <div class="ouv-air ouv-apres"></div>
  <p class="ouv-notice" id="texteNotice"></p>
</main>
<nav class="chrome-bas" id="superNav">
  <button class="verbe actif" aria-current="true" data-verbe="space" aria-label="Plan"><span class="ico-rond"><svg class="i"><use href="#i-plan"/></svg></span></button>
  <button class="verbe" data-verbe="roots" aria-label="Roots"><span class="ico-rond"><svg class="i"><use href="#i-roots"/></svg></span></button>
  <button class="verbe" data-verbe="roam" aria-label="Roam"><span class="ico-rond"><svg class="i"><use href="#i-roam"/></svg></span></button>
</nav>
<div class="voile-menu" id="voileMenu"></div>
<div class="menu-pop" id="drawer">
  <div class="tete"><button class="fermer" id="fermerMenu" aria-label="Fermer" data-al-chrome="fermer"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="sections"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>
(function () {
  'use strict';

  var SUITE = 'space.html';
  var PORTE = 'plan';

  var T = {
    fr: {
      descriptionPage: 'l’app pour NU',
      titreEcran: 'Mi Space | Ton espace est prêt',
      appel: 'Ton espace est prêt',
      titre: 'Comment doit-on t’appeler ?',
      tPrenom: 'Prénom',
      alEntrer: 'Entrer dans mon espace',
      aparte: 'Le nom que tu liras en haut de ton espace. Tu pourras en changer quand tu veux.',
      prenomVide: 'Entre le nom qu’on doit utiliser.',
      patiente: 'Un instant…',
      langue: 'Langue',
      toastNu: 'Le mode NU (communauté) arrive bientôt.',
      noticeMuette: 'Le texte d’information n’est pas arrivé. Recharge la page.',
      langue: 'Langue',
      toastNu: 'Le mode NU (communauté) arrive bientôt.'
    },
    en: {
      descriptionPage: 'the NU app',
      titreEcran: 'Mi Space | Your space is ready',
      appel: 'Your space is ready',
      titre: 'What should we call you?',
      tPrenom: 'First name',
      alEntrer: 'Enter my space',
      aparte: 'The name you will read at the top of your space. You can change it whenever you want.',
      prenomVide: 'Enter the name we should use.',
      patiente: 'One moment…',
      langue: 'Language',
      toastNu: 'NU, the community side of Roots, is coming soon.',
      noticeMuette: 'The information text didn’t arrive. Reload the page.',
      langue: 'Language',
      toastNu: 'NU, the community side of Roots, is coming soon.'
    }
  };

  /* Les symboles du tronc sont poses par le script de la page : un second
     script en ligne demanderait un second condensat a la politique. */
  Roots.sprite();

  function $(id) { return document.getElementById(id); }
  var langue = Roots.langueRetenue(Roots.langueParDefaut());
  function t() { return T[langue] || T.fr; }

  var chrome = Roots.initChrome({
    toastId: 'toast',
    getLangue: function () { return langue; },
    getSections: Roots.nav,
    toastNu: function (l) { return T[l].toastNu; },
    radio: true,
    onLangue: function () { basculerLangue(); }
  });
  Onboard.chrome();

  var notice = null;

  /* Cet ecran suppose un compte ouvert : sans session, l'ouverture de l'acces
     echouerait apres la saisie. Le renvoi se fait avant tout affichage. */
  if (!(Roots.db && Roots.db.estConnecte())) { location.replace('onboard.html'); return; }

  function dire(texte, appelle) {
    var p = $('paroleNom');
    p.textContent = texte || '';
    p.classList.toggle('appelle', !!appelle);
    p.classList.toggle('se-voit', !!texte);
  }

  /* Le nom de l'ecran se pose dans les fentes qui le demandent — l'onglet et
     le titre de la carte de partage — depuis une seule chaine. Une fente qui
     porterait sa propre version serait un second nom. */
  /* La description de l'app est unique : les deux fentes qui la portent
     recoivent la meme chaine, et elle suit la langue lue. */
  function poserDescription(mot) {
    if (!mot) return;
    ['meta[name="description"]', 'meta[property="og:description"]'].forEach(function (sel) {
      var el = document.querySelector(sel);
      if (el) el.setAttribute('content', mot);
    });
  }

  function poserNom(mot) {
    if (!mot) return;
    document.title = mot;
    var og = document.querySelector('meta[property="og:title"]');
    if (og) og.setAttribute('content', mot);
  }

  function appliquerLangue() {
    poserNom(t().titreEcran);
    poserDescription(t().descriptionPage);
    document.documentElement.lang = langue;
    /* Le chrome commun redessine ses propres libelles — sa bascule de langue
       comprise, qui vit au pied de son tiroir. Il attend que l'ecran le lui
       demande a chaque bascule ; sans cet appel, son lien reste sur la langue
       precedente. */
    if (chrome && chrome.dessinerSections) chrome.dessinerSections();
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = t()[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-al]').forEach(function (el) {
      var c = el.getAttribute('data-al');
      var v = t()['al' + c.charAt(0).toUpperCase() + c.slice(1)];
      if (typeof v === 'string') el.setAttribute('aria-label', v);
    });
    $('texteNotice').textContent = Roots.db.texteNotice(notice, langue);
    poserBascule();
  }

  /* Le texte affiche est celui de la version scellee avec l'ouverture : il est
     lu a la base, jamais ecrit dans la page. Sans version, l'ecriture est
     refusee, et le geste ne peut donc pas etre offert. */
  Roots.db.notice(PORTE).then(function (n) {
    notice = n || null;
    $('texteNotice').textContent = Roots.db.texteNotice(n, langue);
    if (!n) { dire(t().noticeMuette, true); }
  }, function (e) { dire(e.message, true); });

  /* Le nom d'appel reste sur l'appareil : aucune porte du service ne l'accepte,
     et un champ dont la saisie serait jetee ne doit pas exister. Le jour ou une
     porte l'accepte, l'envoi se pose ici et la conservation locale demeure ou
     disparait selon ce qui sera tranche. Le refus du stockage n'empeche pas
     d'entrer : la personne perd son nom d'appel, pas son acces. */
  function retenirNom(nom) {
    try { localStorage.setItem('roots.nomAppel', nom); } catch (e) {}
  }

  $('btnPrenom').addEventListener('click', function () {
    var p = $('prenom').value.trim();
    if (!p) { dire(t().prenomVide, true); $('prenom').focus(); return; }
    if (!notice) { dire(t().noticeMuette, true); return; }
    retenirNom(p);
    dire(t().patiente, false);
    $('btnPrenom').setAttribute('aria-busy', 'true');
    Roots.db.appeler('ouvrir_mon_acces_plan', { p_version: notice.version }).then(function () {
      location.replace(SUITE);
    }, function (e) {
      $('btnPrenom').setAttribute('aria-busy', 'false');
      dire(e.message, true);
    });
  });


  /* La bascule de langue nomme la langue vers laquelle elle mene, porte cette
     langue en attribut pour la synthese vocale, et son nom accessible porte le
     mot entier que deux lettres ne donnent pas. */
  function poserBascule() {
    var b = $('btnLangue');
    b.textContent = langue === 'fr' ? 'EN' : 'FR';
    b.setAttribute('lang', langue === 'fr' ? 'en' : 'fr');
    b.setAttribute('aria-label', t().langue);
  }

  function basculerLangue() {
    langue = (langue === 'fr') ? 'en' : 'fr';
    if (Roots.retenirLangue) Roots.retenirLangue(langue);
    appliquerLangue();
  }

  $('btnLangue').addEventListener('click', basculerLangue);

  if (Roots.poserLibelles) Roots.poserLibelles();
  appliquerLangue();
})();
</script>
</body>
</html>
